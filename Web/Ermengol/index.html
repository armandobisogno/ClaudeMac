<title>Ermengol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%99%94%E2%99%95%E2%99%96%E2%99%97%E2%99%98%E2%99%99%E2%99%9A%E2%99%9B%E2%99%9C%E2%99%9D%E2%99%9E%E2%99%9F&display=block">
<style>
/* Layout: la scacchiera è il centro; accanto (o sotto, sul telefono) il "cartiglio" di Ermengol, come una glossa a margine. */
:root{
  --bg:#ECEEEA; --surface:#F8F9F6; --surface-2:#E2E5E0; --line:#CDD2CB;
  --ink:#1B2027; --muted:#5A636C;
  --lapis:#27408B; --lapis-soft:#DCE3F3; --on-lapis:#F5F1E4;
  --gold:#A9822F;
  --good:#2E7A4C; --warn:#A8701A; --bad:#AE372B;
  --sq-l:#E7DDC5; --sq-d:#A27C58;
  --hl-last:rgba(214,168,62,.48); --hl-sel:rgba(39,64,139,.42); --dot:rgba(24,30,48,.32);
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-chess:"Noto Sans Symbols 2", "Segoe UI Symbol", "DejaVu Sans", "Apple Symbols", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#192029; --surface-2:#222B36; --line:#2E3946;
  --ink:#E5E8EC; --muted:#9AA4AF;
  --lapis:#8FA7F0; --lapis-soft:#22305A; --on-lapis:#11151B;
  --gold:#D3AE60;
  --good:#5FBF86; --warn:#E0A84C; --bad:#EE7A6C;
  --sq-l:#D9CDB2; --sq-d:#8E6A4A;
  --hl-last:rgba(214,168,62,.5); --hl-sel:rgba(110,140,230,.5); --dot:rgba(20,24,36,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#192029; --surface-2:#222B36; --line:#2E3946;
  --ink:#E5E8EC; --muted:#9AA4AF;
  --lapis:#8FA7F0; --lapis-soft:#22305A; --on-lapis:#11151B;
  --gold:#D3AE60;
  --good:#5FBF86; --warn:#E0A84C; --bad:#EE7A6C;
  --sq-l:#D9CDB2; --sq-d:#8E6A4A;
  --hl-last:rgba(214,168,62,.5); --hl-sel:rgba(110,140,230,.5); --dot:rgba(20,24,36,.4);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
.app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.01em}
.initial{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--lapis);color:var(--gold);font-family:var(--f-display);font-size:26px;line-height:1;border-radius:4px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 55%,transparent)}
:root[data-theme="dark"] .initial{color:#E9C979}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .initial{color:#E9C979;background:#2B4592}}
:root[data-theme="dark"] .initial{background:#2B4592}
.initial.speaking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 6px color-mix(in srgb,var(--lapis) 25%,transparent)}}
.tabs-top{display:flex;gap:4px;margin-left:16px}
.spacer{flex:1}
.chip{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.chip.ok i{background:var(--good)} .chip.busy i{background:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;min-width:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn[aria-pressed="true"]{background:var(--lapis);color:var(--on-lapis);border-color:var(--lapis)}
.iconbtn svg{width:16px;height:16px}

/* tabs */
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.tabs-bottom{display:none}
@media (max-width:760px){
  .tabs-top{display:none}
  .chip span{display:none}
  .tabs-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs-bottom .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 4px;border-radius:8px}
  .tabs-bottom .tab svg{width:20px;height:20px}
  main{padding-bottom:78px}
}
main{flex:1}
.screen{padding-block:24px 40px;display:flex;flex-direction:column;gap:24px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500;font-size:14px;line-height:1.2;text-align:left}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* home */
.hello{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:stretch}
@media (max-width:860px){.hello{grid-template-columns:1fr}}
.greet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px}
.greet h1{font-size:clamp(34px,6vw,52px)}
.greet p{margin:0;max-width:60ch;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
button.card:hover{border-color:var(--lapis)}
.card h3{font-size:24px}
.card .big{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.side{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.list>*{padding:12px 14px;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
button.li:hover{background:var(--surface-2)}
.li .t{min-width:0}
.li .t b{display:block;font-weight:500}
.li .t small{color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.lapis{color:var(--lapis);border-color:color-mix(in srgb,var(--lapis) 45%,transparent)}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sectionhead h2{font-size:30px}

/* lessons */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lesson{position:relative}
.lesson .num{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--gold)}
.lesson p{margin:0;color:var(--muted);font-size:14px}
.custom{background:var(--lapis-soft);border:1px solid color-mix(in srgb,var(--lapis) 30%,transparent);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.custom h3{font-size:24px}
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:16px}

/* tavola */
.tavola{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start;padding-block:18px 32px}
@media (max-width:900px){.tavola{grid-template-columns:1fr;gap:14px;padding-block:12px 24px}}
.boardcol{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}
.boardbox{width:min(100%,calc(100dvh - 150px));min-width:240px;max-width:680px}
@media (max-width:900px){.boardbox{width:min(100%,calc(100dvh - 260px));min-width:min(100%,300px)}}
.board{position:relative;width:100%;aspect-ratio:1;max-width:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--sq-d) 70%,#000),0 10px 30px -14px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;display:grid;place-items:center}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq.last::before,.sq.sel::before,.sq.hint::before{content:"";position:absolute;inset:0}
.sq.last::before{background:var(--hl-last)}
.sq.sel::before{background:var(--hl-sel)}
.sq.hint::before{box-shadow:inset 0 0 0 4px var(--lapis)}
.sq.check{background-image:radial-gradient(circle,rgba(220,40,30,.85) 0%,rgba(220,40,30,.35) 45%,transparent 70%)}
.sq .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:var(--dot);z-index:2;pointer-events:none}
.sq .ring{position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 calc(var(--sq,40px)*.08) var(--dot);z-index:2;pointer-events:none}
.co{position:absolute;font-family:var(--f-mono);font-size:max(9px,calc(var(--sq,40px)*.18));font-weight:500;line-height:1;pointer-events:none;z-index:1}
.co.f{right:4%;bottom:4%} .co.r{left:5%;top:5%}
.sq.l .co{color:var(--sq-d)} .sq.d .co{color:var(--sq-l)}
.pc{position:relative;z-index:3;width:100%;height:100%;display:grid;place-items:center;font-family:var(--f-chess);font-size:calc(var(--sq,40px)*.8);line-height:1;pointer-events:none;font-variant-emoji:text}
.pc i,.pc b{grid-area:1/1;font-style:normal;font-weight:400}
.pc.w i{color:#FBF8EF} .pc.w b{color:#1A1A1C}
.pc.b i{color:#18191C;text-shadow:0 0 1px rgba(255,255,255,.55)}
.pc.lift{opacity:.25}
.dragghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-58%) scale(1.1)}
.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.promo{position:absolute;inset:0;z-index:6;background:rgba(10,12,16,.55);display:grid;place-items:center}
.promo div{display:flex;gap:6px;background:var(--surface);padding:8px;border-radius:10px}
.promo button{width:calc(var(--sq,40px)*1.1);height:calc(var(--sq,40px)*1.1);border:1px solid var(--line);border-radius:8px;background:var(--sq-l);padding:0}
.under{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.who .sw{width:12px;height:12px;border-radius:2px;border:1px solid var(--muted)}
.sw.w{background:#FBF8EF} .sw.b{background:#18191C}

.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panelhead h2{font-size:28px}
.status{font-size:12px;font-family:var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.status.think::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.scroll{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.scroll .head{display:flex;align-items:center;gap:10px}
.scroll .head .name{font-family:var(--f-display);font-size:22px;line-height:1}
.scroll .head .badge{margin-left:auto}
.scroll .text{font-size:16px;line-height:1.55;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.scroll .text.thinking{color:var(--muted);font-style:italic}
.scroll .acts{display:flex;flex-wrap:wrap;gap:8px}
.scroll .replay{position:absolute;top:12px;right:12px}
.badge.grave{color:var(--bad)} .badge.errore{color:var(--warn)} .badge.inacc{color:var(--muted)}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--surface-2)}
.steps i.on{background:var(--gold)} .steps i.cur{background:var(--lapis)}
.moves{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-family:var(--f-mono);font-size:13.5px;max-height:220px;overflow:auto;display:grid;grid-template-columns:2.6em 1fr 1fr;gap:2px 6px;align-content:start}
.moves .n{color:var(--muted);padding:3px 0}
.moves button{border:0;background:none;text-align:left;padding:3px 6px;border-radius:5px;font-family:inherit;font-size:inherit}
.moves button:hover{background:var(--surface-2)}
.moves button.cur{background:var(--lapis-soft)}
.moves .g{color:var(--bad);font-weight:600} .moves .e{color:var(--warn);font-weight:600} .moves .i{color:var(--muted)}
.navbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:16px}
.setup{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--on-lapis)}
.levelname{font-family:var(--f-display);font-size:22px}
input[type=range]{width:100%;accent-color:var(--lapis)}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}

/* sheet */
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.45);display:flex;justify-content:flex-end}
.sheet{width:min(420px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.sheet h2{font-size:30px}
.sheet select,.sheet input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;font-size:16px;width:100%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
@media (min-width:761px){.toast{bottom:24px}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top"><div class="wrap">
    <button class="brand" data-go="home" aria-label="Ermengol, inizio"><span class="initial" id="avatarTop">E</span><b>Ermengol</b></button>
    <nav class="tabs-top" id="tabsTop"></nav>
    <span class="spacer"></span>
    <span class="chip" id="sync"><i></i><span>Avvio…</span></span>
    <button class="iconbtn" id="voiceBtn" aria-pressed="true" title="Voce di Ermengol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><span id="voiceLbl">Voce</span></button>
    <button class="iconbtn" id="setBtn" title="Impostazioni" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div></header>
  <main id="main"></main>
  <nav class="tabs-bottom" id="tabsBottom"></nav>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- utilità ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const START="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const DEVICE=(()=>{let d=lsGet("erm.dev");if(!d){d=Math.random().toString(36).slice(2,10);lsSet("erm.dev",d)}return d})();
const fmtDate=t=>new Date(t).toLocaleDateString("it-IT",{day:"numeric",month:"short"});

/* ---------- notazione ---------- */
const PIECE_IT={K:"R",Q:"D",R:"T",B:"A",N:"C"};
const NAME_EN={k:"Re",q:"Donna",r:"Torre",b:"Alfiere",n:"Cavallo",p:"pedone"};
const NAME_IT={R:"Re",D:"Donna",T:"Torre",A:"Alfiere",C:"Cavallo"};
const itSan=san=>!san?"":san.replace(/^[KQRBN]/,c=>PIECE_IT[c]).replace(/=([QRBN])/,(m,c)=>"="+PIECE_IT[c]);
const bare=s=>String(s||"").replace(/[+#?!]/g,"");
const uciObj=u=>({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||undefined});
const toUci=m=>m.from+m.to+(m.promotion||"");
const colName=c=>c==="w"?"Bianco":"Nero";
const other=c=>c==="w"?"b":"w";
function sanLine(fen,ucis,max=6){const c=new Chess(fen);const out=[];for(const u of (ucis||[]).slice(0,max)){const m=c.move(uciObj(u));if(!m)break;out.push(m.san)}return out}
function numbered(fen,sans){const parts=fen.split(" ");let n=+parts[5]||1;let side=parts[1];const out=[];sans.forEach((s,i)=>{if(side==="w")out.push(n+". "+itSan(s));else out.push((i===0?n+"... ":"")+itSan(s));if(side==="b")n++;side=other(side)});return out.join(" ")}
function describe(fen){const c=new Chess(fen);const g={w:{},b:{}};const order=["k","q","r","b","n","p"];
  for(const f of "abcdefgh")for(let r=1;r<=8;r++){const p=c.get(f+r);if(p)(g[p.color][p.type]=g[p.color][p.type]||[]).push(f+r)}
  const pl={k:"Re",q:"Donna",r:"Torri",b:"Alfieri",n:"Cavalli",p:"pedoni"};
  const side=col=>order.filter(t=>g[col][t]).map(t=>{const a=g[col][t];return (a.length>1?pl[t]:NAME_EN[t])+" "+a.join(" ")}).join(", ");
  return "Pezzi del Bianco: "+side("w")+". Pezzi del Nero: "+side("b")+"."}
function speakable(t){
  t=String(t||"").replace(/[*_`>]+/g,"").replace(/\(([^)]*)\)/g,", $1,");
  t=t.replace(/\b\d+\.(\.\.)?\s?(?=[RDTACa-hO0])/g,"");
  t=t.replace(/\bO-O-O\b|\b0-0-0\b/g,"arrocco lungo").replace(/\bO-O\b|\b0-0\b/g,"arrocco corto");
  t=t.replace(/\b([RDTAC])([a-h]?[1-8]?)(x?)([a-h][1-8])(=[DTAC])?([+#])?/g,(m,p,d,x,sq,pr,ch)=>NAME_IT[p]+" "+(x?"prende in ":"")+sq+(pr?" e promuove a "+NAME_IT[pr[1]]:"")+(ch==="+"?", scacco":ch==="#"?", scacco matto":""));
  t=t.replace(/\b([a-h])x([a-h][1-8])(=[DTAC])?([+#])?/g,(m,f,sq,pr,ch)=>"il pedone prende in "+sq+(pr?" e promuove a "+NAME_IT[pr[1]]:"")+(ch==="+"?", scacco":ch==="#"?", scacco matto":""));
  t=t.replace(/\b([a-h][1-8])=([DTAC])/g,(m,sq,p)=>sq+" e promuove a "+NAME_IT[p]);
  t=t.replace(/\b([a-h][1-8])\+/g,"$1, scacco").replace(/\b([a-h][1-8])#/g,"$1, scacco matto");
  t=t.replace(/[?!]{2}/g,"").replace(/\s+/g," ");
  return t.trim()}

function migrate(s){const f=freshState();if(!s||typeof s!=="object")return f;
  const o=Object.assign(f,s);o.settings=Object.assign(freshState().settings,s.settings||{});o.profile=Object.assign(freshState().profile,s.profile||{});
  o.lessons=o.lessons||{};o.deck=Array.isArray(o.deck)?o.deck:[];o.history=Array.isArray(o.history)?o.history:[];o.view=o.view||{screen:"home"};return o}

const Store={ref:null,timer:null,writing:false,dirty:false,mode:"local",
  async init(){
    const cl=window.claude;if(!cl||!cl.use){this.setChip();return}
    try{
      const [db,user]=await Promise.all([cl.use("db"),cl.use("user")]);
      const uid=user?await user.id():null;
      if(!db||!uid){this.setChip();return}
      this.ref=db.doc("data/users/"+uid+"/state");
      const snap=await this.ref.get();
      if(snap.exists){const r=snap.data();if((r.updatedAt||0)>(S.updatedAt||0))applyRemote(r,false);else if((S.updatedAt||0)>(r.updatedAt||0))this.flush()}
      else if(S.updatedAt)this.flush();
      this.mode="cloud";this.setChip();
      this.ref.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const r=s.data();
        if(r.device!==DEVICE&&(r.updatedAt||0)>(S.updatedAt||0))applyRemote(r,true)},()=>{this.mode="local";this.setChip()});
    }catch(e){this.mode="local";this.setChip()}
  },
  touch(){S.updatedAt=Date.now();S.device=DEVICE;lsSet("erm.state",JSON.stringify(S));
    if(!this.ref)return;clearTimeout(this.timer);this.setChip("busy");this.timer=setTimeout(()=>this.flush(),1200)},
  async flush(){if(!this.ref)return;clearTimeout(this.timer);if(this.writing){this.dirty=true;return}
    this.writing=true;try{await this.ref.set(JSON.parse(JSON.stringify(S)));this.mode="cloud"}catch(e){this.mode="error"}
    this.writing=false;this.setChip();if(this.dirty){this.dirty=false;this.flush()}},
  setChip(st){const el=$("#sync");const span=el.querySelector("span");el.className="chip";
    if(st==="busy"){el.classList.add("busy");span.textContent="Salvataggio…";el.title="Salvataggio in corso"}
    else if(this.mode==="cloud"){el.classList.add("ok");span.textContent="Sincronizzato";el.title="Salvato nel tuo account: riprendi da qualsiasi dispositivo"}
    else if(this.mode==="error"){span.textContent="Non salvato";el.title="Il salvataggio online non è riuscito; riprovo alla prossima mossa"}
    else{span.textContent="Solo qui";el.title="Salvato solo su questo dispositivo: apri Ermengol da claude.ai, con il tuo account, per sincronizzare"}}
};

const CDN_SF="https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js";
const Engine={w:null,ready:null,ok:false,handler:null,queue:Promise.resolve(),
  tryWorker(make,ms){return new Promise(res=>{let w;try{w=make()}catch(e){return res(null)}
    const fail=()=>{clearTimeout(t);try{w.terminate()}catch(e){}res(null)};
    const t=setTimeout(fail,ms);
    w.onmessage=e=>{const s=String(e.data);if(s.startsWith("uciok")){clearTimeout(t);res(w)}else if(/abort|failed|CompileError|LinkError/i.test(s))fail()};
    w.onerror=()=>{clearTimeout(t);try{w.terminate()}catch(e){}res(null)};w.postMessage("uci")})},
  init(){if(this.ready)return this.ready;this.ready=(async()=>{
    const c=[];if(typeof WebAssembly==="object")c.push([()=>new Worker("engine/stockfish.wasm.js"),12000]);
    c.push([()=>new Worker("engine/stockfish.js"),30000]);
    c.push([()=>new Worker(URL.createObjectURL(new Blob(['importScripts("'+CDN_SF+'")'],{type:"application/javascript"}))),30000]);
    for(const [make,ms] of c){const w=await this.tryWorker(make,ms);if(w){this.w=w;this.ok=true;w.onmessage=e=>this.handler&&this.handler(String(e.data));w.postMessage("setoption name Hash value 16");return true}}
    return false})();return this.ready},
  analyse(fen,o){const job=this.queue.then(()=>this.run(fen,o||ANALYSIS));this.queue=job.catch(()=>{});return job},
  async run(fen,o){await this.init();if(!this.ok)return null;
    return new Promise(res=>{let last={};const side=fen.split(" ")[1];const sign=side==="w"?1:-1;let done=false;
      const finish=best=>{if(done)return;done=true;clearTimeout(guard);this.handler=null;

  const sqs=squares();let h="";sqs.forEach((s,i)=>{const fi="abcdefgh".indexOf(s[0]),rk=+s[1];const light=(fi+rk)%2===1;
    const cls=["sq",light?"l":"d"];if(s===lastFrom||s===lastTo)cls.push("last");if(s===T.sel)cls.push("sel");if(T.hl[s])cls.push(T.hl[s]);if(s===checkSq)cls.push("check");

let drag=null;

  if(T.sel&&T.sel!==s){const legal=c.moves({square:T.sel,verbose:true}).filter(m=>m.to===s);if(legal.length){tryMove(T.sel,s,legal);return}}

      if(drag.el){drag.el.style.left=ev.clientX+"px";drag.el.style.top=ev.clientY+"px"}};

function gameChess(){const c=new Chess(S.game.startFen);for(const u of S.game.moves)c.move(uciObj(u));return c}

function setupEnter(){T.chess=new Chess(START);T.orient=S.settings.color==="b"?"b":"w";T.interactive=false;T.msg=null;renderBoard();renderPanel()}

function bindGameExtra(){const st=S.settings;

function setView(n){T.reviewBefore=false;T.arrows=[];T.viewPly=n>=S.game.moves.length&&!S.game.result?null:n;renderBoard();renderPanel()}
function viewPly(j){const g=S.game;const a=g.ann[j];T.sel=null;

function startGame(){const st=S.settings;const color=st.color==="r"?(Math.random()<.5?"w":"b"):st.color;
  S.game={id:Date.now().toString(36),startFen:START,moves:[],color,level:st.level,guided:st.guided,ann:{},result:null,started:Date.now(),hints:0,takebacks:0};
  S.view={screen:"tavola",mode:"game"};touch();T.chess=gameChess();T.orient=color;T.viewPly=null;renderBoard();
  afterPosition(color==="w"?`Cominciamo. Hai il Bianco, quindi la prima mossa è tua.`:`Cominciamo. Tu hai il Nero: apro io.`)}
function afterPosition(intro){const c=T.chess;renderBoard();
  if(c.game_over()){finishGame();return}
  if(c.turn()===S.game.color)userTurn(intro);else engineTurn(intro)}
function userTurn(intro){T.interactive=true;T.hintLvl=0;status("Tocca a te");if(intro)say({text:intro});else renderPanel();
  const fen=T.chess.fen();T.pendingA={fen,p:Engine.analyse(fen,ANALYSIS)}}
async function engineTurn(intro){T.interactive=false;const my=++T.gen;status("Ermengol pensa…",true);if(intro)say({text:intro});else renderPanel();
  const fen=T.chess.fen();const L=LEVELS[S.game.level-1];const t0=Date.now();
  const r=await Engine.analyse(fen,{skill:L.skill,depth:L.depth,movetime:L.mt});if(my!==T.gen)return;
  if(!r||!r.best){status("");say({text:Engine.ok?"Qualcosa non è andato: non riesco a trovare una mossa. Prova a ricaricare la pagina.":"Il motore di gioco non si è caricato su questo dispositivo, quindi per ora non posso giocare. Le lezioni funzionano lo stesso.",actions:[{label:"Vai alle lezioni",fn:()=>go("lessons")}]});return}
  const wait=500-(Date.now()-t0);if(wait>0)await sleep(wait);if(my!==T.gen)return;
  const m=T.chess.move(uciObj(r.best));if(!m)return;S.game.moves.push(toUci(m));touch();
  if(S.settings.announce&&!speakingFlag)Voice.speak(itSan(m.san));
  afterPosition()}
async function gameUserMove(mv){const c=T.chess;const fenBefore=c.fen();const m=c.move(mv);if(!m){renderBoard();return}
  const ply=S.game.moves.length;S.game.moves.push(toUci(m));touch();T.interactive=false;T.arrows=[];T.hl={};T.msg=null;renderBoard();
  if(c.game_over()){finishGame();return}
  const my=++T.gen;status("Ermengol osserva…",true);renderPanel();
  const a=T.pendingA&&T.pendingA.fen===fenBefore?await T.pendingA.p:await Engine.analyse(fenBefore,ANALYSIS);
  const b=await Engine.analyse(c.fen(),ANALYSIS);if(my!==T.gen)return;
  const ann=judge(fenBefore,m,a,b,ply);
  if(ann){S.game.ann[ply]=ann;addToDeck(ann);touch()}
  if(ann&&S.game.guided&&ann.cls!=="inacc"){intervene(ply);return}
  if(ann&&S.game.guided)say({text:pick(["Piccola imprecisione: c'era qualcosa di meglio. Ne parliamo alla fine.","Mossa giocabile, ma non la più precisa. La segno e andiamo avanti.","Non è un errore grave, ma c'era di meglio. Lo rivedremo."])});
  engineTurn()}
function judge(fen,m,a,b,ply){if(!a||!b||!a.best||!a.eval||!b.eval)return null;const col=fen.split(" ")[1];
  if(toUci(m)===a.best)return null;const before=winFor(col,a.eval),after=winFor(col,b.eval);const loss=before-after;
  const cls=loss>=.2?"grave":loss>=.1?"errore":loss>=.05?"inacc":null;if(!cls)return null;
  if(cls==="inacc"&&after>.92)return null;
  const after_fen=new Chess(fen);after_fen.move(m);
  return{cls,ply,fen,color:col,san:m.san,uci:toUci(m),bestUci:a.best,bestSan:sanLine(fen,[a.best])[0]||"",bestPv:sanLine(fen,a.pv,6),refUci:b.best,refPv:sanLine(after_fen.fen(),b.pv,6),evB:a.eval,evA:b.eval,loss:+loss.toFixed(3)}}
function addToDeck(a){if(a.cls==="inacc")return;if(S.deck.some(d=>d.fen===a.fen))return;
  S.deck.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),fen:a.fen,color:a.color,san:a.san,uci:a.uci,bestUci:a.bestUci,bestSan:a.bestSan,bestPv:a.bestPv,refPv:a.refPv,evB:a.evB,cls:a.cls,date:Date.now(),streak:0,tries:0,gameId:S.game?.id});
  if(S.deck.length>120){const i=S.deck.findIndex(d=>d.mastered);S.deck.splice(i>=0?i:0,1)}}
function threatHint(a){const opp=colName(other(a.color));const r=a.refPv[0]||"";
  if(r.includes("#"))return `Attenzione: dopo questa mossa il ${opp} ha un matto. Riesci a vederlo?`;
  if(a.evA&&a.evA.mate!=null&&((a.color==="w")?a.evA.mate<0:a.evA.mate>0))return `Attenzione: dopo questa mossa il ${opp} ha un attacco che porta al matto. Guarda bene il tuo Re.`;
  if(r.includes("x"))return `Dopo questa mossa il ${opp} può prendere qualcosa. Guarda la posizione con i suoi occhi: che cosa resta indifeso?`;
  if(r.includes("+"))return `Dopo questa mossa il ${opp} ha uno scacco molto fastidioso. Lo vedi?`;
  return `Il ${opp} ha una risposta forte. Prova a guardare la scacchiera dalla sua parte: che cosa vorresti fare, al suo posto?`}
function intervene(ply){const a=S.game.ann[ply];T.arrows=[];renderBoard();status("");
  const open=a.cls==="grave"?pick(["Fermati un momento.","Aspetta, aspetta.","Ferma tutto un istante."]):pick(["Un momento.","Fermiamoci un attimo.","Mmh. Guardiamo meglio."]);
  say({badge:a.cls,keep:true,text:`${open} Hai giocato ${itSan(a.san)}. ${threatHint(a)}`,actions:interveneActions(ply,false)})}
function interveneActions(ply,shown){const a=S.game.ann[ply];const acts=[];
  if(!shown)acts.push({label:"Mostrami la risposta",fn:()=>showRefutation(ply)});
  if(!a.expl&&!sampleOff)acts.push({label:"Spiegami perché",fn:()=>explain(ply)});
  acts.push({label:"Riprovo la mossa",kind:"primary",fn:()=>takeBackTo(ply,true)});
  acts.push({label:"Vado avanti",fn:()=>{T.arrows=[];T.msg=null;renderBoard();engineTurn()}});return acts}
function showRefutation(ply){const a=S.game.ann[ply];const opp=colName(other(a.color));T.arrows=a.refUci?[[a.refUci,"bad"]]:[];renderBoard();
  const rest=a.refPv.slice(1,4);
  say({badge:a.cls,keep:true,text:`Il ${opp} risponderebbe ${itSan(a.refPv[0])}${rest.length?", e la linea più probabile continua con "+rest.map(itSan).join(", "):""}. La valutazione passa da ${fmtEval(a.evB)} a ${fmtEval(a.evA)}. Al posto della tua mossa era meglio ${itSan(a.bestSan)}.`,actions:interveneActions(ply,true)})}
async function explain(ply,review){const a=S.game.ann[ply];const g=S.game;const name=S.profile.name||"l'allievo";
  const prev=sanLine(g.startFen,g.moves.slice(0,ply),999);
  say({badge:a.cls,keep:true,thinking:true,text:"Ermengol riflette…"},false);status("Ermengol riflette…",true);
  const prompt=`${persona()}

Situazione. ${describe(a.fen)}
Tocca al ${colName(a.color)}, cioè a ${name}. Mosse della partita fin qui: ${prev.length?numbered(g.startFen,prev):"nessuna"}.
${name} ha giocato ${itSan(a.san)}.
Analisi del motore, affidabile, da non contraddire: valutazione prima della mossa ${fmtEval(a.evB)}, dopo la mossa ${fmtEval(a.evA)} (numeri positivi = vantaggio del Bianco). La mossa migliore era ${itSan(a.bestSan)}, con la linea ${a.bestPv.map(itSan).join(" ")}. Dopo la mossa giocata, la risposta più forte dell'avversario è ${a.refPv.map(itSan).join(" ")}.

Compito: spiega in 3-5 frasi perché ${itSan(a.san)} è ${CLS[a.cls].lbl.toLowerCase()}. Indica il motivo concreto (un pezzo che resta indifeso, una tattica, una casa debole, una minaccia ignorata) usando soltanto le linee del motore, senza inventarne altre. Poi spiega l'idea della mossa migliore. Chiudi con una frase che sia un principio pratico da ricordare.
Rispondi solo in JSON: {"spiegazione": "...", "tema": "..."} dove tema è uno tra: ${TEMI.join(", ")}.`;
  let text,tema=null;
  try{const r=await askClaude(prompt,{json:true});text=String(r.spiegazione||"").trim();tema=TEMI.includes(r.tema)?r.tema:null}
  catch(e){text=fallbackExpl(a)+(e&&e.code==="rate_limited"?" (Per ora non posso ragionarci più a fondo: riprova tra poco.)":"")}

  if(review||S.game.result||T.viewPly!=null){say({badge:a.cls,text});return}

function fallbackExpl(a){const opp=colName(other(a.color));return `Hai giocato ${itSan(a.san)}. Il problema è la risposta ${itSan(a.refPv[0]||"")} del ${opp}${a.refPv.length>1?", che continua con "+a.refPv.slice(1,4).map(itSan).join(", "):""}. La valutazione passa da ${fmtEval(a.evB)} a ${fmtEval(a.evA)}. La mossa migliore era ${itSan(a.bestSan)}${a.bestPv.length>1?", con l'idea "+a.bestPv.slice(1,4).map(itSan).join(", "):""}.`}
function takeBackTo(ply,retry){T.gen++;S.game.moves=S.game.moves.slice(0,ply);Object.keys(S.game.ann).forEach(k=>{if(+k>=ply)delete S.game.ann[k]});S.game.takebacks++;touch();

  userTurn(retry?pick(["Bene. La posizione è di nuovo quella di prima: cerca una mossa migliore.","Ecco la posizione di prima. Con calma: scacchi, catture, minacce.","Riproviamo. Guarda prima che cosa vuole l'avversario."]):null)}
function undoMove(){if(!S.game||!S.game.moves.length)return;const g=S.game;
  const turnAt=k=>{const cc=new Chess(g.startFen);g.moves.slice(0,k).forEach(u=>cc.move(uciObj(u)));return cc.turn()};
  let n=g.moves.length-1;while(n>=0&&turnAt(n)!==g.color)n--;

async function hint(){if(!T.pendingA||!T.interactive)return;const a=await T.pendingA.p;if(!a||!a.best)return;S.game.hints++;touch();

  else{T.hintLvl=2;T.hl={};T.arrows=[[a.best,"lapis"]];renderBoard();const san=sanLine(T.chess.fen(),[a.best])[0];say({text:`La mossa che giocherei è ${itSan(san)}.`})}}
function finishGame(reason,silent){const g=S.game;const c=gameChess();let r="½-½",why=reason||"";
  if(reason==="abbandono"){r=g.color==="w"?"0-1":"1-0"}
  else if(c.in_checkmate()){r=c.turn()==="w"?"0-1":"1-0";why="scacco matto"}
  else if(c.in_stalemate())why="stallo";else if(c.in_threefold_repetition())why="ripetizione";else if(c.insufficient_material())why="materiale insufficiente";else if(c.in_draw())why="regola delle 50 mosse";
  g.result={r,why};const anns=Object.values(g.ann);const errs=anns.filter(a=>a.cls!=="inacc").length;

function endMsg(){const g=S.game;const r=g.result;const won=(r.r==="1-0"&&g.color==="w")||(r.r==="0-1"&&g.color==="b");const draw=r.r==="½-½";
  const anns=Object.entries(g.ann).sort((a,b)=>a[0]-b[0]);const grave=anns.filter(([,a])=>a.cls==="grave").length,err=anns.filter(([,a])=>a.cls==="errore").length,ina=anns.filter(([,a])=>a.cls==="inacc").length;
  let t=won?(r.why==="scacco matto"?"Scacco matto. Hai vinto, complimenti.":"Hai vinto."):draw?`Patta, per ${r.why}.`:r.why==="abbandono"?"Hai abbandonato. Capita: anche questo fa parte del gioco.":"Scacco matto. Questa volta ho vinto io.";
  t+=grave+err+ina===0?" Non ho trovato errori nelle tue mosse: partita pulita.":` Ho segnato ${[grave&&grave+" "+(grave===1?"errore grave":"errori gravi"),err&&err+" "+(err===1?"errore":"errori"),ina&&ina+" "+(ina===1?"imprecisione":"imprecisioni")].filter(Boolean).join(", ")}. Gli errori sono finiti nel ripasso.`;
  if(won&&grave===0&&g.level<8)t+=" Credo che tu sia pronto per un livello più alto.";
  const acts=[];if(anns.length)acts.push({label:"Rivediamo gli errori",kind:"primary",fn:()=>viewPly(+anns[0][0])});

  else acts.push({label:"Rivincita",fn:()=>{S.settings.level=g.level;S.settings.color=g.color==="w"?"b":"w";startGame()}});
  return{text:t,actions:acts}}
async function gameComment(){const g=S.game;const sans=sanLine(g.startFen,g.moves,999);const anns=Object.values(g.ann);
  say({thinking:true,text:"Ermengol ripensa alla partita…"},false);status("Ermengol riflette…",true);
  const prompt=`${persona()}

Partita appena finita. ${S.profile.name||"L'allievo"} aveva il ${colName(g.color)}, contro di te a forza "${LEVELS[g.level-1].name}". Risultato ${g.result.r} (${g.result.why||"fine"}).
Mosse: ${numbered(g.startFen,sans)}.
Errori rilevati dal motore: ${anns.length?anns.map(a=>`mossa ${Math.floor(a.ply/2)+1}: giocato ${itSan(a.san)} invece di ${itSan(a.bestSan)} (${CLS[a.cls].lbl.toLowerCase()}${a.tema?", tema "+a.tema:""})`).join("; "):"nessuno"}.
Lezioni disponibili: ${LESSONS.map(l=>l.title).join("; ")}.

Fai un commento di 4-6 frasi, come un maestro dopo la partita: che cosa è andato bene, qual è stato il momento decisivo, una sola cosa concreta su cui lavorare e, se adatta, quale delle lezioni rifare. Non inventare mosse che non sono nella partita.`;
  try{const r=await askClaude(prompt,{onText:({text})=>{const el=$("#msgText");if(el){el.textContent=text;el.classList.remove("thinking")}}});status("");say({text:r.text.trim(),actions:endMsg().actions.filter(a=>a.label!=="Il commento di Ermengol")})}
  catch(e){status("");say({text:"Adesso non riesco a commentare la partita. Puoi comunque rivedere gli errori uno per uno.",actions:endMsg().actions.filter(a=>a.label!=="Il commento di Ermengol")})}}

/* ---------- LEZIONE ---------- */
function exFen(x){if(x.fen)return x.fen;const c=new Chess();(x.moves||"").split(" ").filter(Boolean).forEach(s=>c.move(s));return c.fen()}
function lessonEnter(){const L=LESSONS.find(l=>l.id===S.view.lessonId)||LESSONS[0];const st=S.lessons[L.id]=S.lessons[L.id]||{step:0,ex:[]};
  T.lesson={L,step:Math.min(st.step||0,L.steps.length-1)};showStep()}
function showStep(){const {L,step}=T.lesson;const s=L.steps[step];T.arrows=[];T.hl={};T.sel=null;T.ex=null;
  S.lessons[L.id].step=step;touch();
  if(s.ex){const fen=exFen(s.ex);T.chess=new Chess(fen);T.orient=T.chess.turn();T.ex={...s.ex,idx:0,wrong:0,fen};T.interactive=true;renderBoard();
    const pre=s.ex.moves?`Posizione dopo ${numbered(START,sanLine(START,movesToUci(s.ex.moves),99))}. `:"";
    say({title:`Esercizio · muove il ${colName(T.chess.turn())}`,text:s.ex.prompt,html:pre?`<div class="muted" style="font-family:var(--f-mono);font-size:12.5px">${esc(pre)}</div>`:"",actions:exActions()});return}
  if(s.fen||s.moves){T.chess=new Chess(s.fen||exFen({moves:s.moves}));const nx=L.steps.slice(step).find(x=>x.ex);T.orient=nx?new Chess(exFen(nx.ex)).turn():T.chess.turn()}
  else if(!T.chess){T.chess=new Chess(START)}
  T.arrows=(s.arrows||[]).map(a=>a.slice());T.interactive=false;renderBoard();
  const last=step===L.steps.length-1;const acts=[];
  if(step>0)acts.push({label:"Indietro",fn:()=>{T.lesson.step--;showStep()}});
  if(!last)acts.push({label:"Avanti",kind:"primary",fn:()=>{T.lesson.step++;showStep()}});
  else{acts.push({label:"Lezione completata",kind:"primary",fn:()=>completeLesson()})}
  say({text:s.say,actions:acts})}
function movesToUci(str){const c=new Chess();const out=[];str.split(" ").filter(Boolean).forEach(s=>{const m=c.move(s);if(m)out.push(toUci(m))});return out}
function exActions(){const acts=[];if(T.ex.wrong>=1||T.ex.hinted)acts.push({label:"Mostrami la soluzione",fn:showSolution});else acts.push({label:"Suggerimento",fn:()=>{T.ex.hinted=true;say({title:"Suggerimento",text:T.ex.hint,actions:exActions()})}});
  if(T.lesson.step>0)acts.push({label:"Indietro",kind:"ghost",fn:()=>{T.lesson.step--;showStep()}});return acts}
function showSolution(){const x=T.ex;const san=x.sol[x.idx];const c=new Chess(T.chess.fen());const m=c.move(san);if(m){T.arrows=[[toUci(m),"good"]];renderBoard()}
  say({title:"La soluzione",text:`La mossa è ${itSan(san)}. Giocala tu sulla scacchiera.`,actions:[]});x.shown=true}
async function lessonMove(mv){const x=T.ex;if(!x){return}const c=T.chess;const m=c.move(mv);if(!m){renderBoard();return}
  T.arrows=[];T.hl={};renderBoard();const s=bare(m.san);
  const okFirst=x.idx===0&&(x.accept.map(bare).includes(s));const alt=x.idx===0&&(x.alts||[]).find(a=>bare(a.san)===s);
  const okNext=x.idx>0&&bare(x.sol[x.idx])===s;
  if(okFirst||okNext||alt){if(okFirst&&bare(x.sol[0])!==s){x.sol=[m.san]}
    x.idx++;if(alt)x.altNote=alt.note;
    if(x.idx<x.sol.length){T.interactive=false;status("");await sleep(650);const r=c.move(x.sol[x.idx]);x.idx++;renderBoard();
      if(x.idx<x.sol.length){T.interactive=true;say({title:"Bene. Continua",text:pick(["Bene. E adesso?","Giusto. Ora completa l'idea.","Esatto. Prosegui."]),actions:[]});return}}
    exDone();return}
  T.interactive=false;x.wrong++;
  say({text:x.wrong===1?`${pick(["Non è questa.","No, non ancora.","Mmh, non ci siamo."])} ${x.hint}`:pick(["Ancora no. Se vuoi, ti mostro la soluzione.","No. Guarda di nuovo le mosse forzanti: scacchi e catture."]),actions:[]},true);
  await sleep(900);c.undo();T.interactive=true;renderBoard();T.msg.actions=exActions();renderPanel()}
function exDone(){const {L,step}=T.lesson;T.interactive=false;const st=S.lessons[L.id];if(!st.ex.includes(step)&&!T.ex.shown)st.ex.push(step);touch();
  const txt=(T.ex.altNote?T.ex.altNote+" ":"")+T.ex.ok;const last=step===L.steps.length-1;
  say({title:T.ex.shown?"Risolto con aiuto":"Esatto",text:txt,actions:[last?{label:"Lezione completata",kind:"primary",fn:completeLesson}:{label:"Avanti",kind:"primary",fn:()=>{T.lesson.step++;showStep()}},{label:"Rifai l'esercizio",fn:()=>showStep()}]})}
function completeLesson(){const {L}=T.lesson;S.lessons[L.id].completed=true;S.lessons[L.id].step=0;touch();const i=LESSONS.indexOf(L);const nx=LESSONS[i+1];
  say({text:nx?`Lezione completata. La prossima è «${nx.title}». Oppure, per fissare le idee, una partita: è lì che si vede se hai capito.`:"Hai completato tutte le lezioni. Adesso la scuola vera sono le partite, e il ripasso dei tuoi errori. E se vuoi, chiedimi una lezione su misura.",
    actions:[nx?{label:"Prossima lezione",kind:"primary",fn:()=>openLesson(nx.id,0)}:{label:"Lezione su misura",kind:"primary",fn:()=>go("lessons")},{label:"Gioca una partita",fn:()=>go("game")},{label:"Tutte le lezioni",kind:"ghost",fn:()=>go("lessons")}]})}
function lessonExtra(){const {L,step}=T.lesson;const st=S.lessons[L.id];
  return `<div class="steps" aria-label="Passo ${step+1} di ${L.steps.length}">${L.steps.map((s,i)=>`<i class="${i===step?"cur":i<step||(s.ex&&st.ex.includes(i))?"on":""}"></i>`).join("")}</div>`}
function bindLessonExtra(){}

/* ---------- RIPASSO (esercizio) ---------- */
function drillEnter(){const d=S.deck.find(x=>x.id===S.view.drillId);if(!d){go("ripasso");return}T.drill=d;T.drillWrong=0;
  T.chess=new Chess(d.fen);T.orient=d.color;T.interactive=true;renderBoard();
  say({title:`Partita del ${fmtDate(d.date)} · muove il ${colName(d.color)}`,text:`In questa posizione hai giocato ${itSan(d.san)}${d.tema?" ("+d.tema+")":""}. Trova una mossa migliore.`,actions:[{label:"Ricordami il problema",fn:()=>say({text:`Dopo ${itSan(d.san)} l'avversario rispondeva ${itSan(d.refPv?.[0]||"")}${d.refPv?.length>1?", e poi "+d.refPv.slice(1,3).map(itSan).join(", "):""}.`,actions:[{label:"Mostrami la soluzione",fn:drillSolution}]})}]})}
function drillExtra(){const n=activeDeck().length;return `<div class="muted" style="font-size:13px">${n} ${n===1?"posizione":"posizioni"} da rivedere · questa: ${T.drill?.streak||0} su 2</div>`}
function bindDrillExtra(){}
function drillSolution(){const d=T.drill;T.arrows=[[d.bestUci,"good"]];renderBoard();say({text:`La mossa migliore era ${itSan(d.bestSan)}${d.bestPv?.length>1?", con l'idea "+d.bestPv.slice(1,4).map(itSan).join(", "):""}. Giocala tu.`,actions:[]});d.streak=0;T.drillShown=true;touch()}
async function drillMove(mv){const d=T.drill;const c=T.chess;const fen=c.fen();const m=c.move(mv);if(!m){renderBoard();return}T.arrows=[];renderBoard();T.interactive=false;
  let good=toUci(m)===d.bestUci,also=false;
  if(!good){status("Ermengol controlla…",true);const r=await Engine.analyse(c.fen(),ANALYSIS);status("");
    if(r&&r.eval&&d.evB){const loss=winFor(d.color,d.evB)-winFor(d.color,r.eval);if(loss<.05){good=true;also=true}}
    if(!good){d.tries++;d.streak=0;touch();T.drillWrong++;const reply=r&&r.best?sanLine(c.fen(),[r.best])[0]:null;
      say({text:`No, c'è ancora un problema${reply?": l'avversario risponderebbe "+itSan(reply):""}. Riprova.`,actions:[{label:"Mostrami la soluzione",fn:drillSolution}]});
      await sleep(1100);c.undo();T.interactive=true;renderBoard();return}}
  if(T.drillShown){T.drillShown=false}else{d.streak=(d.streak||0)+1}
  if(d.streak>=2)d.mastered=true;touch();
  const next=activeDeck().filter(x=>x.id!==d.id).slice(-1)[0];
  say({title:d.mastered?"Posizione imparata":"Giusto",text:(also?`Anche ${itSan(m.san)} va bene. Io avrei giocato ${itSan(d.bestSan)}. `:`${itSan(m.san)}, esatto. `)+(d.mastered?"Questa posizione ormai la conosci: la tolgo dal ripasso.":"Te la riproporrò un'altra volta, per fissarla."),
    actions:[next?{label:"Prossima posizione",kind:"primary",fn:()=>openDrill(next.id)}:{label:"Fine del ripasso",kind:"primary",fn:()=>go("ripasso")},{label:"Torna all'elenco",kind:"ghost",fn:()=>go("ripasso")}]})}

/* ---------- LEZIONE SU MISURA ---------- */
async function makeCustom(topic){S.view={screen:"tavola",mode:"custom",step:0};S.custom={titolo:topic,passi:[{testo:"Preparo la lezione…"}],loading:true};render();
  say({thinking:true,text:"Ermengol prepara la lezione…"},false);status("Ermengol prepara…",true);
  const prompt=`${persona()}

Prepara una breve lezione sul tema: "${topic}". Struttura: da 4 a 6 passi. Ogni passo ha "testo" (2-4 frasi, da leggere a voce) e, se serve, "mosse": una sequenza di mosse in notazione SAN inglese (K Q R B N; esempio "e4 e5 Nf3 Nc6 Bc4") giocate dalla posizione iniziale, separate da spazi, senza numeri, che porta a una posizione che illustra quel passo. Usa soltanto sequenze legali e famose di cui sei sicuro; se il tema non si presta, ometti "mosse". L'ultimo passo riassume in un principio pratico.
Rispondi solo in JSON: {"titolo":"...","passi":[{"testo":"...","mosse":"..."}]}`;
  try{const r=await askClaude(prompt,{json:true,tier:"default"});
    const passi=(Array.isArray(r.passi)?r.passi:[]).slice(0,8).map(p=>{let mosse=null;if(p.mosse){const c=new Chess();const ok=String(p.mosse).replace(/\d+\.+/g," ").split(/\s+/).filter(Boolean).every(s=>c.move(s));if(ok)mosse=String(p.mosse).replace(/\d+\.+/g," ").trim()}return{testo:String(p.testo||""),mosse}}).filter(p=>p.testo);
    if(!passi.length)throw{code:"empty"};S.custom={titolo:String(r.titolo||topic),passi};S.view.step=0;touch();status("");customEnter()}
  catch(e){status("");S.custom=null;touch();say({text:e&&e.code==="not_granted"?"Per preparare lezioni su misura devo poter usare Claude: l'hai negato per questa visita. Ricarica la pagina se vuoi riprovare.":"Adesso non riesco a preparare la lezione. Riprova tra un po', oppure scegli una delle lezioni pronte.",actions:[{label:"Torna alle lezioni",fn:()=>go("lessons")}]})}}
function customEnter(){const C=S.custom;if(!C||C.loading){if(!C)go("lessons");return}const i=Math.min(S.view.step||0,C.passi.length-1);const p=C.passi[i];
  if(p.mosse){T.chess=new Chess();p.mosse.split(/\s+/).forEach(s=>T.chess.move(s))}else if(!T.chess)T.chess=new Chess();
  T.interactive=true;T.arrows=[];renderBoard();
  const acts=[];if(i>0)acts.push({label:"Indietro",fn:()=>{S.view.step=i-1;touch();customEnter()}});
  acts.push(i<C.passi.length-1?{label:"Avanti",kind:"primary",fn:()=>{S.view.step=i+1;touch();customEnter()}}:{label:"Fine",kind:"primary",fn:()=>go("lessons")});
  say({title:`Passo ${i+1} di ${C.passi.length}`,text:p.testo,actions:acts})}
function customExtra(){return S.custom&&!S.custom.loading?`<div class="muted" style="font-size:13px">Puoi muovere i pezzi liberamente per provare le idee della lezione.</div>`:""}
function bindCustomExtra(){}

/* ---------- domande libere ---------- */
async function askFree(q){const c=boardChess();const m=S.view.mode;let ctx="";
  if(c)ctx=`Posizione sulla scacchiera. ${describe(c.fen())} Muove il ${colName(c.turn())}. FEN: ${c.fen()}.`;
  if(m==="game"&&S.game){const sans=sanLine(S.game.startFen,S.game.moves,999);ctx+=` È una partita: ${S.profile.name||"l'allievo"} ha il ${colName(S.game.color)}. Mosse: ${sans.length?numbered(S.game.startFen,sans):"nessuna"}.`;
    if(T.pendingA){const a=await Promise.race([T.pendingA.p,sleep(2500).then(()=>null)]);if(a&&a.eval)ctx+=` Il motore valuta la posizione ${fmtEval(a.eval)} e suggerisce ${itSan(sanLine(T.pendingA.fen,[a.best])[0]||"")}. Se ti chiede la mossa da giocare in una partita in corso, non dargliela subito: aiutalo a trovarla con una domanda o un indizio.`}}
  if(m==="lesson"&&T.lesson)ctx+=` Siete nella lezione «${T.lesson.L.title}».`;
  T.chat.push({q,a:null});T.chat=T.chat.slice(-4);
  const hist=T.chat.slice(0,-1).filter(x=>x.a).map(x=>`Allievo: ${x.q}\nErmengol: ${x.a}`).join("\n");
  const prompt=`${persona()}\n\n${ctx}\n${hist?"Conversazione recente:\n"+hist+"\n":""}\nDomanda dell'allievo: ${q}\n\nRispondi in al massimo 6 frasi, concrete e riferite alla posizione se c'entra. Se non sei sicuro di una variante, dillo invece di inventare.`;
  const keep=T.msg;say({thinking:true,text:"Ermengol riflette…",title:"Domanda: "+q},false);status("Ermengol riflette…",true);
  try{const r=await askClaude(prompt,{onText:({text})=>{const el=$("#msgText");if(el){el.textContent=text;el.classList.remove("thinking")}}});T.chat[T.chat.length-1].a=r.text;status("");
    say({title:"Domanda: "+q,text:r.text.trim(),actions:keep&&keep.actions&&keep.actions.length?[{label:"Torna al discorso",fn:()=>say(keep,false)}]:[]})}
  catch(e){status("");say({text:e&&e.code==="not_granted"?"Per rispondere alle domande devo poter usare Claude, e per questa visita l'hai negato.":"Adesso non riesco a rispondere. Riprova tra poco.",actions:keep?[{label:"Torna al discorso",fn:()=>say(keep,false)}]:[]});if(sampleOff)renderPanel()}}

/* ---------- impostazioni ---------- */
function openSettings(){const st=S.settings;const r=$("#sheetRoot");
  r.innerHTML=`<div class="sheetbg" id="sheetBg"><div class="sheet" role="dialog" aria-label="Impostazioni">
   <div class="row" style="justify-content:space-between"><h2>Impostazioni</h2><button class="btn small" id="closeSet">Chiudi</button></div>
   <label class="lbl">Come ti chiama Ermengol<input type="text" id="setName" value="${esc(S.profile.name)}"></label>
   <div class="toggle"><span>Ermengol parla a voce</span><input type="checkbox" id="setVoice" ${st.voice?"checked":""}></div>
   <div class="toggle"><span>Annuncia a voce le sue mosse</span><input type="checkbox" id="setAnn" ${st.announce?"checked":""}></div>
   <label class="lbl">Voce${Voice.list.length?`<select id="setVoiceSel"><option value="">Automatica</option>${Voice.list.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===st.voiceURI?"selected":""}>${esc(v.name)}</option>`).join("")}</select>`:`<span>${Voice.ok?"Nessuna voce italiana trovata su questo dispositivo: verrà usata quella predefinita.":"Questo browser non supporta la sintesi vocale."}</span>`}</label>
   <label class="lbl">Velocità della voce · <span id="rateV">${st.rate.toFixed(2)}</span><input type="range" id="setRate" min="0.7" max="1.3" step="0.05" value="${st.rate}"></label>
   <div class="row"><button class="btn" id="testVoice">Prova la voce</button></div>
   <hr style="border:0;border-top:1px solid var(--line);width:100%">
   <div class="muted" style="font-size:13px">${Store.mode==="cloud"?"I tuoi progressi sono salvati nel tuo account Claude: apri Ermengol da un altro dispositivo con lo stesso account e riprendi da dove eri.":"In questo momento i progressi sono salvati solo su questo dispositivo. Aprendo Ermengol da claude.ai con il tuo account, si sincronizzano."}</div>
   <div id="resetBox"><button class="btn danger small" id="resetBtn">Azzera tutti i progressi</button></div>
   <div class="muted" style="font-size:12px">Motore: Stockfish 10 (GPL v3) ${Engine.ok?"· attivo":"· in caricamento"}.</div>
  </div></div>`;
  const close=()=>{r.innerHTML="";render()};$("#closeSet").onclick=close;$("#sheetBg").onclick=e=>{if(e.target.id==="sheetBg")close()};
  $("#setName").onchange=e=>{S.profile.name=e.target.value.trim();touch()};
  $("#setVoice").onchange=e=>{st.voice=e.target.checked;touch();if(!st.voice)Voice.stop()};
  $("#setAnn").onchange=e=>{st.announce=e.target.checked;touch()};
  const vs=$("#setVoiceSel");if(vs)vs.onchange=()=>{st.voiceURI=vs.value;Voice.pick();touch()};
  $("#setRate").oninput=e=>{st.rate=+e.target.value;$("#rateV").textContent=st.rate.toFixed(2)};$("#setRate").onchange=()=>touch();
  $("#testVoice").onclick=()=>Voice.speak(`Ciao${S.profile.name?" "+S.profile.name:""}. Io sono Ermengol. Dopo e4 e5, Cavallo f3, il Nero deve difendere il pedone.`.replace("e4 e5, Cavallo f3","e4 e5 Cf3"),true);
  $("#resetBtn").onclick=()=>{$("#resetBox").innerHTML=`<div class="text" style="margin-bottom:8px">Cancello lezioni, partite e ripasso, su tutti i dispositivi. Sei sicuro?</div><div class="row"><button class="btn danger small" id="resetYes">Sì, azzera</button><button class="btn small" id="resetNo">Annulla</button></div>`;
    $("#resetNo").onclick=()=>openSettings();$("#resetYes").onclick=()=>{const keep={profile:S.profile,settings:S.settings};S=freshState();S.profile=keep.profile;S.settings=keep.settings;touch();Store.flush();close();toast("Progressi azzerati")}}}
$("#setBtn").onclick=openSettings;
$("#voiceBtn").onclick=()=>{S.settings.voice=!S.settings.voice;touch();if(!S.settings.voice)Voice.stop();else Voice.speak("Eccomi.");render()};
let toastT=null;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ---------- avvio ---------- */
function start(data){if(data&&data.S)S=migrate(data.S);render();Store.init();Engine.init()}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)try{hot.snapshot(()=>({S}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script>
