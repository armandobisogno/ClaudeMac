<title>Catastrofi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: un solo palco 320×200 al centro; scena in alto (320×140), pannello verbi e inventario sotto. Un solo tema, scuro per scelta. */
:root{
  --bg:#0b0a10; --panel:#17131c; --edge:#2e2638; --ink:#f2ead0; --dim:#8d8499;
  --verb:#e9b44c; --red:#e0281c; --cap:#f1e6c8; --capink:#1a1612;
  --font-ui:'Pixelify Sans','VT323',ui-monospace,monospace;
  --font-tx:'VT323',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-tx);box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{width:min(100%,1120px,calc((100vh - 72px)*1.6));width:min(100%,1120px,calc((100dvh - 72px)*1.6));
  aspect-ratio:320/200;container-type:inline-size;position:relative;background:#000;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;outline:1px solid var(--edge)}
#scene{position:relative;width:100%;aspect-ratio:320/140;overflow:hidden;transition:opacity .16s;cursor:crosshair}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#speech{position:absolute;left:0;bottom:0;width:max-content;max-width:56%;text-align:center;font-size:4.1cqw;line-height:.92;
  pointer-events:none;text-shadow:.3cqw 0 #000,-.3cqw 0 #000,0 .3cqw #000,0 -.3cqw #000,.3cqw .3cqw #000,-.3cqw -.3cqw #000,.3cqw -.3cqw #000,-.3cqw .3cqw #000}
#cap{position:absolute;top:3%;left:50%;transform:translateX(-50%);width:86%;box-sizing:border-box;background:var(--cap);color:var(--capink);
  font-size:3.7cqw;line-height:.98;padding:.9cqw 1.6cqw 1.1cqw;border:.4cqw solid var(--capink);box-shadow:.6cqw .6cqw 0 rgba(0,0,0,.55);pointer-events:none}
.lab{position:absolute;transform:translateX(-50%);font-size:3.3cqw;line-height:1;white-space:nowrap;pointer-events:none;color:var(--ink);
  text-shadow:.3cqw 0 #000,-.3cqw 0 #000,0 .3cqw #000,0 -.3cqw #000}
#panel{position:absolute;left:0;right:0;bottom:0;top:70%;background:var(--panel);border-top:.5cqw solid var(--edge);box-sizing:border-box;display:flex;flex-direction:column}
#sent{height:5cqw;line-height:5cqw;font-size:4cqw;text-align:center;color:var(--verb);white-space:nowrap;overflow:hidden}
#ui{flex:1;min-height:0;display:flex}
#ui.busy{opacity:.4;pointer-events:none}
#verbs{width:36%;display:grid;grid-template-columns:1fr 1fr;gap:.6cqw;padding:.2cqw .8cqw .8cqw}
#verbs button{font-family:var(--font-ui);font-weight:600;font-size:3.5cqw;line-height:1;color:var(--verb);background:#211a29;border:.3cqw solid var(--edge);cursor:pointer;padding:0}
#verbs button:hover{color:#fff}
#verbs button.on{background:var(--verb);color:#1a1410;border-color:var(--verb)}
#inv{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.6cqw;padding:.2cqw .8cqw .8cqw;overflow-y:auto}
.it{width:8.6cqw;height:8.6cqw;padding:.5cqw;background:#211a29;border:.3cqw solid var(--edge);cursor:pointer;box-sizing:border-box}
.it canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.it:hover{border-color:var(--verb)} .it.on{border-color:var(--red);background:#3a1c1c}
#choices{position:absolute;inset:0;background:var(--panel);overflow-y:auto;display:flex;flex-direction:column;padding:.8cqw 2cqw;box-sizing:border-box}
#choices button{font-family:var(--font-tx);font-size:3.8cqw;line-height:1;text-align:left;color:var(--verb);background:none;border:0;padding:.35cqw 0;cursor:pointer}
#choices button:hover{color:#fff}
button:focus-visible{outline:.4cqw solid #fff;outline-offset:-.4cqw}
#over{position:absolute;inset:0;z-index:5;background:rgba(6,5,9,.95);display:flex;align-items:center;justify-content:center;text-align:center;overflow-y:auto}
#over h1{font-family:var(--font-ui);font-weight:600;font-size:12cqw;letter-spacing:.06em;margin:0;line-height:1;color:var(--ink)}
#over h1::after{content:"";display:block;width:14cqw;height:1cqw;background:var(--red);margin:2cqw auto 0}
#over p{font-size:4.2cqw;line-height:1;margin:2.4cqw 0 0;color:var(--dim)}
#over .btns{display:flex;gap:3cqw;justify-content:center;margin-top:5cqw}
#over button{font-family:var(--font-ui);font-size:4cqw;color:var(--verb);background:#211a29;border:.4cqw solid var(--verb);padding:1cqw 3cqw;cursor:pointer}
#over button:hover{background:var(--verb);color:#1a1410}
#over .letter{max-width:74%;text-align:left;font-size:3.7cqw;line-height:1.02;color:var(--capink);background:var(--cap);padding:3cqw 4cqw;margin:3cqw 0;border:.4cqw solid var(--capink)}
#over .letter p{color:inherit;font-size:inherit;margin:0 0 1.6cqw}
#over .letter .blues{font-style:italic;color:#7a2a22}
#over .letter small{display:block;font-size:3cqw;color:#5a5244;border-top:.3cqw dashed #8a8068;padding-top:1.2cqw;margin-top:1.2cqw}
#bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;font-size:17px;line-height:1;color:var(--dim);max-width:100%}
#bar button{font-family:var(--font-tx);font-size:17px;color:var(--verb);background:none;border:1px solid var(--edge);padding:3px 10px;cursor:pointer}
#bar button:hover{border-color:var(--verb)}
@media (prefers-reduced-motion:reduce){#scene{transition:none}}
</style>

<div id="stage">
  <div id="scene">
    <canvas id="cv" width="320" height="140"></canvas>
    <div id="labels"></div>
    <div id="speech" hidden></div>
    <div id="cap" hidden></div>
  </div>
  <div id="panel">
    <div id="sent"></div>
    <div id="ui">
      <div id="verbs">
        <button id="v-look" data-v="look">Guarda</button>
        <button id="v-talk" data-v="talk">Parla</button>
        <button id="v-take" data-v="take">Prendi</button>
        <button id="v-use" data-v="use">Usa</button>
      </div>
      <div id="inv"></div>
    </div>
    <div id="choices" hidden></div>
  </div>
  <div id="over" hidden></div>
</div>
<div id="bar">
  <button id="b-music">♪ blues: no</button>
  <button id="b-reset">ricomincia</button>
  <span>Prototipo · da «Catastrofi», in <i>Terapie</i> (De Tomi, 2024)</span>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const W=320,H=140,cv=$('#cv'),G=cv.getContext('2d');
const scene=$('#scene'),spEl=$('#speech'),capEl=$('#cap'),sentEl=$('#sent'),uiEl=$('#ui'),invEl=$('#inv'),chEl=$('#choices'),over=$('#over'),labEl=$('#labels');
let g=G,T=0;
const KEY='catastrofi-save-1';
const fresh=()=>({room:'cucina',f:{},inv:[],x:150,dir:1,pl:'spiri'});
let S=fresh();
let busy=false,verb=null,sel=null,hover=null,hoverIt=null,skip=null,talker=null,overlay=null,tx=null,walkRes=null,um=null,vasoPh=0,bgc={};

/* ---------- utilità ---------- */
const F=k=>!!S.f[k];
const set=k=>{S.f[k]=1;bgc={};save()};
const has=id=>S.inv.includes(id);
const give=id=>{if(!has(id)){S.inv.push(id);renderInv();save()}};
const drop=id=>{S.inv=S.inv.filter(i=>i!==id);renderInv();save()};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.room?d:null}catch(e){return null}}

/* ---------- primitive di disegno ---------- */
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)};
const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function grad(x,y,w,h,c1,c2){R(x,y,w,h,c1);g.fillStyle=c2;for(let j=0;j<h;j++){const t=(j+.5)/h*16;for(let i=0;i<w;i++)if(BAY[((y+j)&3)*4+((x+i)&3)]<t)g.fillRect(x+i,y+j,1,1)}}
function che(x,y,w,h,c){g.fillStyle=c;for(let j=0;j<h;j++)for(let i=(j+y+x)&1;i<w;i+=2)g.fillRect(x+i,y+j,1,1)}
function ridge(pts,c,top){for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[e,f]=pts[i+1];for(let x=a;x<e;x++){const y=Math.round(b+(f-b)*(x-a)/(e-a));top?R(x,0,1,y,c):R(x,y,1,H-y,c)}}}
function ln(x0,y0,x1,y1,c){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++)R(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1,c)}
const BOOKC=['#7a2a22','#2f4a6a','#6a5a2a','#3a5a3a','#8a6a3a','#4a2a4a','#b09a6a','#283040','#9a3a2a','#c8b888'];
function books(x,y,w,h,seed){let i=0,k=seed;while(i<w){const bw=Math.min(1+(rnd(k++)*3|0),w-i),bh=h-(rnd(k++)*4|0);R(x+i,y+h-bh,bw,bh,BOOKC[(rnd(k++)*BOOKC.length)|0]);i+=bw}}
function pile(x,y,n,seed){for(let i=0;i<n;i++)R(x+(rnd(seed+i)*3|0),y-3*i-3,11,3,BOOKC[(rnd(seed+i+40)*BOOKC.length)|0])}
function rain(x,y,w,h,t,n){g.fillStyle='rgba(208,222,236,.55)';for(let i=0;i<n;i++){const sp=50+rnd(i)*50;g.fillRect((x+rnd(i+.5)*w)|0,(y+((rnd(i+9.3)*h+t*sp)%(h-3)))|0,1,3)}}
function beam(pts,c,a){g.save();g.globalAlpha=a;g.fillStyle=c;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.fill();g.restore()}

/* ---------- personaggi parametrici ---------- */
const SAIO='#2e2824';
const CH={
  spiri:{n:'il professor Spiri',col:'#bfe6a4',skin:'#e6b89a',hair:'#dcd9cf',hs:'short',top:'#7a2638',long:11,belt:'#4e1524',bottom:'#3b3f55',shoes:'#6a4a2a',glasses:'#e8e8e8'},
  spiri2:{col:'#bfe6a4',skin:'#e6b89a',hair:'#dcd9cf',hs:'short',top:'#8b8f96',zip:1,bottom:'#5a6a88',shoes:'#3a7a9a',glasses:'#e8e8e8'},
  malversi:{col:'#f2ead0',skin:'#d9a680',hair:'#8d8a86',hs:'back',beard:'#9a9792',top:'#5a4630',shirt:'#d8d2c2',bottom:'#2c2f3a',shoes:'#1a1410',glasses:'#1c1c22',cigar:1,w:11},
  tonino:{col:'#ff9a5c',skin:'#eeb898',hair:'#c0401c',hs:'short',beard:'#c0401c',top:'#2a3b66',shirt:'#9ab0d8',bottom:'#23304f',shoes:'#111',w:14,leg:14,torso:17},
  graziella:{col:'#f29ac6',skin:'#e6b090',hair:'#6a3c22',hs:'bob',top:'#d8c44a',stripes:'#b0382c',bottom:'#3e5f96',flare:1,shoes:'#d04a8a',w:9},
  questore:{col:'#9ac4f0'},
  marco:{col:'#f0c060',skin:'#e0a884',hair:'#8a8378',hs:'short',robe:SAIO,glasses:'#c8502a'},
  leone:{col:'#c9d6e6',skin:'#d8a888',hair:'#eeeeea',hs:'short',robe:SAIO,beard:'#f2f2ee',bs:'long',bl:19,brows:'#f2f2ee',broom:1},
  dom:{col:'#a8d8c8',skin:'#e6b494',hair:'#3a2a1e',hs:'short',robe:SAIO,leg:12},
  nic:{col:'#d8c8f0',skin:'#eec0a0',hair:'#c8a050',hs:'short',robe:SAIO,leg:11},
  mario:{col:'#a8e0a0',skin:'#e0aa88',top:'#4a5a4a',shirt:'#d8d8c8',bottom:'#333',glasses:'#111'},
  antonio:{col:'#9ac4f0',skin:'#dca684',hair:'#4a4038',hs:'short',top:'#30323c',shirt:'#f0f0f0',tie:'#8a2030',bottom:'#30323c',w:12},
  luca:{col:'#f0a0a0',skin:'#e8b494',hair:'#1e1a18',hs:'back',top:'#e8e8ee',bottom:'#22242c'},
  russo:{col:'#a0e8e8',skin:'#e6b090',hair:'#5a3a26',hs:'up',top:'#f0f0ec',long:10,inner:'#3a7a8a',bottom:'#33384a',shoes:'#222',w:9}
};
function person(x,y,o,t){
  x=Math.round(x);
  const d=o.dir||1,sil=o.sil;
  const r=(a,b,w,h,c,raw)=>{if(d<0)a=-a-w;g.fillStyle=(sil&&!raw)?'#16100c':c;g.fillRect(x+a,y+b,w,h)};
  const Wd=o.w||10,hw=Wd>>1,L=o.leg||13,Tt=o.torso||15,by=-(L+Tt)-2,sk=o.skin||'#e0a882';
  const tk=o.talking&&((t*7|0)&1),wk=o.walking?((t*9|0)&3):1;
  if(!sil){g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x-hw-2,y,Wd+4,1)}
  if(o.robe){
    r(-hw-1,by,Wd+2,L+Tt+1,o.robe);r(-hw-2,-7,Wd+4,6,o.robe);
    if(!sil){r(-hw-1,by+Tt,Wd+2,1,'#d8ccb0');r(hw-3,by+Tt,1,7,'#d8ccb0')}
    r(-4,-1,3,1,'#3a2a1a');r(1,-1,3,1,'#3a2a1a');
  }else{
    const la=wk===0?-2:wk===2?2:0;
    r(-4+la,-L-2,3,L,o.bottom);r(1-la,-L-2,3,L,o.bottom);
    if(o.flare){r(-5+la,-6,5,4,o.bottom);r(0-la,-6,5,4,o.bottom)}
    r(-4+la,-2,4,2,o.shoes||'#1a1410');r(1-la,-2,4,2,o.shoes||'#1a1410');
    r(-hw,by,Wd,Tt+(o.long||0),o.top);
    if(o.inner)r(-1,by,3,Tt+(o.long||0),o.inner);
    if(o.shirt)r(-1,by,3,4,o.shirt);
    if(o.tie)r(0,by+1,1,7,o.tie);
    if(o.stripes)for(let i=2;i<Tt;i+=3)r(-hw,by+i,Wd,1,o.stripes);
    if(o.zip)r(0,by,1,Tt,'#5a5e64');
    if(o.belt)r(-hw,by+Tt-1,Wd,1,o.belt);
  }
  const sl=o.robe||o.top;
  r(-hw-2,by+1,2,Tt-3,sl);r(hw,by+1,2,Tt-3,sl);
  r(-hw-2,by+Tt-2,2,2,sk);r(hw,by+Tt-2,2,2,sk);
  if(o.stripes)for(let i=2;i<Tt-3;i+=3){r(-hw-2,by+i,2,1,o.stripes);r(hw,by+i,2,1,o.stripes)}
  const hy=by-10,hc=o.hair,hs=o.hs;
  r(-2,by-1,4,1,sk);r(-4,hy,8,9,sk);
  if(hc){
    if(hs==='short'){r(-4,hy-1,8,3,hc);r(-4,hy+2,1,3,hc)}
    else if(hs==='back'){r(-4,hy-2,8,3,hc);r(-5,hy,2,6,hc)}
    else if(hs==='bob'){r(-5,hy-1,10,3,hc);r(-5,hy+2,2,8,hc);r(-3,hy+2,7,1,hc)}
    else if(hs==='long'){r(-5,hy-1,10,3,hc);r(-5,hy+2,2,13,hc)}
    else if(hs==='up'){r(-4,hy-1,8,3,hc);r(-6,hy+1,2,4,hc);r(-4,hy+2,1,4,hc)}
  }
  if(o.beard){if(o.bs==='long')r(-3,hy+5,7,o.bl||16,o.beard);else r(-4,hy+5,8,4,o.beard)}
  const eye=sil?'#c9682c':'#1a1410';
  r(0,hy+3,1,1,eye,1);r(3,hy+3,1,1,eye,1);
  if(o.brows){r(-1,hy+2,2,1,o.brows);r(2,hy+2,3,1,o.brows)}
  if(o.glasses){r(-1,hy+2,6,1,o.glasses);r(-4,hy+3,3,1,o.glasses);r(-1,hy+4,1,1,o.glasses);r(4,hy+4,1,1,o.glasses)}
  r(4,hy+4,1,2,sk);
  if(!sil){if(tk)r(1,hy+6,3,2,'#4a1616');else r(1,hy+7,3,1,o.beard?'#5a2a22':'#8a4a3a')}
  if(o.cigar&&!tk){r(4,hy+7,4,1,'#5a3a20');r(8,hy+7,1,1,'#ff8a30')}
  if(o.broom){r(hw+3,by-6,1,L+Tt+4,'#8a6a3a');r(hw+1,-5,5,5,'#c9a84a')}
  if(o.crown){r(-4,hy-4,2,3,'#000');r(-1,hy-4,2,3,'#000');r(2,hy-4,2,3,'#000')}
  if(o.blade){r(hw+2,by+Tt-2,7,1,'#000');}
  if(o.axe){r(hw+3,by-8,1,Tt+8,'#000');r(hw+4,by-8,5,5,'#000')}
}

/* ---------- parlato, scelte, movimento ---------- */
function posOf(who){
  const rm=rooms[S.room];
  if(overlay)return{x:160,y:134};
  if(who==='me')return rm.noPlayer?{x:160,y:70}:{x:S.x,y:rm.base-46};
  const h=rm.hs.find(h=>h.actor===who&&(!h.if||h.if()));
  if(h)return{x:h.x,y:h.y-(h.sh||46)};
  return{x:160,y:56};
}
function say(who,text){return new Promise(res=>{
  const narr=who==='narr',el=narr?capEl:spEl;
  talker=who;el.textContent=text;el.hidden=false;
  if(!narr){
    el.style.color=(who==='me'?CH[S.pl]:CH[who]||{}).col||'#fff';
    const p=posOf(who),sw=scene.clientWidth,sh=scene.clientHeight,ew=el.offsetWidth,eh=el.offsetHeight;
    el.style.left=clamp(p.x/W*sw-ew/2,4,Math.max(4,sw-ew-4))+'px';
    el.style.bottom=clamp((H-p.y)/H*sh,2,Math.max(2,sh-eh-2))+'px';
  }
  const t0=performance.now();
  const done=()=>{clearTimeout(tm);skip=null;el.hidden=true;talker=null;res()};
  const tm=setTimeout(done,Math.min(11000,1500+text.length*62));
  skip=()=>{if(performance.now()-t0>220)done()};
})}
async function L(...a){for(let i=0;i<a.length;i+=2)await say(a[i],a[i+1])}
function choose(opts){return new Promise(res=>{
  chEl.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.textContent='› '+o.t;b.onclick=()=>{chEl.hidden=true;res(o.k)};chEl.append(b)});
  chEl.hidden=false;chEl.scrollTop=0;sentEl.textContent='';
})}
async function dlg(list){
  for(;;){
    const av=list.filter(o=>(!o.if||o.if())&&!(o.once&&F('d_'+o.k)));
    const k=await choose(av),o=list.find(o=>o.k===k);
    if(o.once)set('d_'+o.k);
    if(o.run)await o.run();
    if(o.end||o.stop&&o.stop())return;
  }
}
function walk(x){
  const rm=rooms[S.room];if(rm.noPlayer)return Promise.resolve();
  x=clamp(x,rm.min,rm.max);if(Math.abs(x-S.x)<1)return Promise.resolve();
  return new Promise(r=>{tx=x;walkRes=r});
}
async function go(id,x){
  scene.style.opacity=0;await wait(170);
  S.room=id;tx=null;S.x=x!=null?x:(rooms[id].start||160);hover=null;
  buildLabels();save();scene.style.opacity=1;await wait(120);
  if(rooms[id].enter)await rooms[id].enter();
  buildLabels();
}
async function show(id,fn){scene.style.opacity=0;await wait(170);overlay=id;labEl.innerHTML='';scene.style.opacity=1;await fn();scene.style.opacity=0;await wait(170);overlay=null;buildLabels();scene.style.opacity=1}
function card(a,b,ms){return new Promise(res=>{
  over.innerHTML='<div><h1></h1><p></p></div>';over.querySelector('h1').textContent=a;over.querySelector('p').textContent=b;over.hidden=false;
  const t0=performance.now(),done=()=>{clearTimeout(tm);skip=null;over.hidden=true;res()},tm=setTimeout(done,ms||3600);
  skip=()=>{if(performance.now()-t0>500)done()};
})}
async function run(fn){
  if(busy)return;busy=true;ui();
  try{await fn()}catch(e){console.error(e)}
  busy=false;verb=null;sel=null;ui();

function hints(){
  if(S.pl==='spiri')return["Una seconda moka. E poi, magari, due parole con Franca."];
  if(!F('u_mangiato'))return["Non si ragiona a stomaco vuoto. Il cornetto."];
  if(!F('u_brief'))return["Farmi aggiornare da Graziella."];
  if(!F('u_questore'))return["Telefonare al questore. Purtroppo."];
  const a=[];
  if(!F('m_marco1'))a.push("Santa Cecilia: parlare con l'abate.");
  else if(!F('m_regola'))a.push("Santa Cecilia: la cella di Barnaba. Che tipo era?");
  else if(!F('regolaLetta'))a.push("Leggere la Regola di San Benedetto. Tutta.");
  else if(!F('m_leone'))a.push("Santa Cecilia: padre Leone, quello che al mattino trova le chiavi. Sta in chiesa.");
  else if(!F('m_ragazzi'))a.push("Santa Cecilia: i due monaci giovani, nel chiostro.");
  else if(!F('m_foto'))a.push("Chiedere conto all'abate della fama social di Barnaba.");
  else if(!F('anagrafe'))a.push("Chiedere a Graziella i dati anagrafici dei monaci.");
  else if(!F('cert'))a.push("Passare in ufficio: i certificati dell'anagrafe.");
  else if(!F('barnaba'))a.push("Quattro certificati, cinque monaci. Tornare dall'abate.");
  if(!F('c_spiri1'))a.push("Carcere: interrogare il professor Spiri.");
  else if(!F('a_tallio'))a.push("«Il cavallo pallido». Giovedì sera da Luca: chiedere a Mario. E poi ad Antonio.");
  else if(!F('msg'))a.push("Mandare un messaggio alla Russo. Una parola sola.");
  else if(!F('b_infarto'))a.push("Caffè con la Russo, padiglione 18.");
  else if(!F('c_conf'))a.push("Tornare in carcere dal professore.");
  else if(!F('verbale'))a.push("Leggere la deposizione di Spiri. È in ufficio, tra i fascicoli.");
  else if(!F('c_libero'))a.push("Tornare da Spiri. E decidere.");
  if(!a.length)a.push("Resta una visita da fare. A casa del professore.");
  return a;
}

async function ragazzi(){
  if(F('m_ragazzi'))return L('nic',"Tutta Fossa segue quel profilo, commissario. E tutti sono in attesa che ricominci a scrivere.");
  await L('me',"Premetto che questo non è un interrogatorio. Non ci sono reati né imputati. Chiacchieriamo.",
    'me',"Negli ultimi mesi mensa piena, messa piena. L'abate era contento?",
    'dom',"Padre Marco ha accolto gli ospiti con grande fervore. Anche se ci invitava sempre alla moderazione.",
    'me',"E Barnaba mangiava con loro? Li incontrava alle omelie?",
    'dom',"No. Con gli ospiti, come previsto dalla Regola, mangia l'abate. E non tutti i monaci sono sacerdoti: qui dicono messa solo padre Marco e padre Leone.",
    'me',"E allora come faceva ad avere sempre più pubblico?",
    'dom',"Era un processo inevitabile. Ormai la cosa era diventata, come si dice… virale. Le visite al profilo crescevano di giorno in giorno.",
    'me',"Scusatemi, ma continuo a non capire.",
    'nic',"Commissario, ma lei li ha mai visti i post del monastero? Lei non ha Facebook?",
    'me',"No. E penso nemmeno l'agente Modun.",'nic',"Allora dobbiamo andare in sala lettura. Lì c'è un computer comune.");
  await show('schermo',async()=>{
    await L('narr',"Nicola avviò il lentissimo computer in dotazione ai monaci. Dopo qualche secondo, sullo schermo apparve il profilo di Barnaba.",
      'me',"Giustizia sociale, uguaglianza, accoglienza, mense aperte. Centinaia di commenti a ogni post.",
      'me',"Ecco servite le diavolerie tecnologiche di padre Leone. Quindi è così che Barnaba ha fatto pubblicità al monastero.",
      'nic',"Proprio così. Ma pensavamo lo sapeste. Tutta Fossa segue questo profilo.")});
  set('m_ragazzi');
  await say('me',"Una star locale di Internet. E l'abate non me ne ha fatto parola.");
}
async function svelaBarnaba(){
  if(F('barnaba'))return;
  await L('marco',"Commissario, che bella sorpresa. Se è qui per la messa è presto, ma intanto posso offrirle un caffè.",
    'me',"No, grazie mille…",'me',"…signor Barnaba.",
    'marco',"Devo dirle che mi aspettavo ci mettesse di meno. Ora però quel caffè non è più un invito. È d'obbligo.",
    'marco',"Sei mesi fa ho aperto un profilo Facebook. Il monastero era diventato un museo, le messe deserte. Mi sono registrato con il mio nome e cognome.",
    'me',"Marco Barnaba.",
    'marco',"Era come scrivere un diario e lasciarlo aperto su una panchina. Poi il direttore de «La pagina» ha invitato tutti a leggere «i post del monaco Barnaba». Apriti cielo.",
    'me',"E qui scatta la truffa.",
    'marco',"Quale truffa? Non ho mai ingannato nessuno. Ma era troppo forte la tentazione di tornare a fare il monaco, scrollandomi di dosso il vestito da abate.",
    'marco',"Senza che nessuno di noi dicesse niente, cominciò a diffondersi la voce che Barnaba facesse vita da eremita nella sua cella.",
    'marco',"Chi veniva qui non cercava una persona. Cercava un luogo dove essere comunità.",
    'me',"Quella che mi ha fatto vedere non era la cella di Barnaba. Era la sua biblioteca.",
    'marco',"Esatto. I libri di quando ero Barnaba: di quando da giovane studiavo per prendere i voti, e sembrava che la Chiesa dovesse cambiare pelle.",
    'me',"E allora perché farlo scomparire?",
    'marco',"Per uno solo: l'arcivescovo. Voleva incontrarlo. Brevettarlo, farne la mascotte della diocesi. Ho dovuto, a malincuore, farlo scappare.",
    'me',"Non poteva dire a tutti che Barnaba non reggeva la pressione e se n'era andato?",
    'marco',"Certo. Però avrei deluso tutti i miei followers, non trova? Il mistero, commissario. Il mistero.");
  set('barnaba');drop('certificati');drop('fototessera');
  await finale();
}

    R(60,36,24,24,'#fff');R(62,38,20,20,'#2e2824');R(66,42,12,12,'#0c0a08');R(62,54,20,4,'#2e2824');
    R(90,52,54,5,'#222');R(90,60,36,2,'#888');R(230,52,30,7,'#3a5ba0');
    for(let p=0;p<2;p++){const y=66+p*25;R(58,y,204,21,'#fff');R(58,y+21,204,1,'#c8ccd4');R(62,y+3,150,2,'#555');R(62,y+7,176,2,'#555');R(62,y+11,96,2,'#555');
      R(62,y+16,4,3,'#3a5ba0');R(68,y+16,22,3,'#aab');R(100,y+16,4,3,'#d0405a');R(106,y+16,30,3,'#aab');R(150,y+16,40,3,'#ccd')}
    R(258,123,3,2,'#40d070');
  },
  fx(t){if((t*2|0)&1)R(160,77,1,3,'#222');g.fillStyle='rgba(0,0,0,.05)';for(let y=14;y<116;y+=2)g.fillRect(52,y,216,1)}};

/* ---------- ciclo di disegno ---------- */
function getBg(id){
  if(!bgc[id]){const c=document.createElement('canvas');c.width=W;c.height=H;g=c.getContext('2d');rooms[id].bg();g=G;bgc[id]=c}
  return bgc[id];
}
let last=0;
function frame(ms){
  const t=ms/1000,dt=Math.min(.05,t-last);last=t;T=t;
  if(tx!=null){const d=tx-S.x,s=78*dt;if(Math.abs(d)<=s){S.x=tx;tx=null;if(walkRes){const r=walkRes;walkRes=null;r()}}else{S.x+=Math.sign(d)*s;S.dir=Math.sign(d)}}
  const id=overlay||S.room,rm=rooms[id];
  if(rm){
    g=G;G.drawImage(getBg(id),0,0);
    const acts=overlay?[]:rm.hs.filter(h=>h.actor&&(!h.if||h.if()));
    const dr=h=>person(h.x,h.y,{...CH[h.actor],dir:h.dir,talking:talker===h.actor},t);
    acts.filter(h=>h.behind).forEach(dr);
    if(rm.mid)rm.mid(t);
    acts.filter(h=>!h.behind).forEach(dr);
    if(!rm.noPlayer)person(S.x,rm.base,{...CH[S.pl],dir:S.dir,walking:tx!=null,talking:talker==='me'},t);
    if(rm.fg)rm.fg(t);
    if(rm.fx)rm.fx(t);
  }
  requestAnimationFrame(frame);
}

/* ---------- interfaccia ---------- */
const VN={look:'Guarda',talk:'Parla con',take:'Prendi',use:'Usa'};
const DEF={look:"Niente di speciale.",talk:"Non mi risponderebbe.",take:"Non mi serve.",use:"Non saprei che farci."};
const vis=h=>!h.if||h.if();
const rect=h=>h.actor?[h.x-9,h.y-46,18,46]:h.r;
function hit(p){
  const hs=rooms[S.room].hs;
  for(let i=hs.length-1;i>=0;i--){const h=hs[i];if(!vis(h))continue;const r=rect(h);if(p.x>=r[0]&&p.x<r[0]+r[2]&&p.y>=r[1]&&p.y<r[1]+r[3])return h}
  return null;
}
function pt(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H}}
function ui(){
  uiEl.classList.toggle('busy',busy);
  document.querySelectorAll('#verbs button').forEach(b=>b.classList.toggle('on',b.dataset.v===verb));
  invEl.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',b.dataset.id===sel));
  let s='';
  if(!busy){
    const hn=hoverIt?IT[hoverIt].n:hover?hover.n:'';
    if(sel)s='Usa '+IT[sel].n+' con '+hn;
    else if(verb)s=VN[verb]+' '+hn;
    else s=hn?((hover&&!hoverIt&&hover.exit?'Vai: ':'')+hn):rooms[S.room].name;
  }
  sentEl.textContent=s;
}
function renderInv(){
  invEl.innerHTML='';
  S.inv.forEach(id=>{
    const b=document.createElement('button');b.className='it';b.dataset.id=id;b.title=IT[id].n;b.setAttribute('aria-label',IT[id].n);
    const c=document.createElement('canvas');c.width=c.height=16;g=c.getContext('2d');IT[id].ic();g=G;b.append(c);
    b.onmouseenter=()=>{hoverIt=id;ui()};b.onmouseleave=()=>{hoverIt=null;ui()};
    b.onclick=()=>itemClick(id);
    invEl.append(b);
  });
}
async function exec(fn){if(typeof fn==='function')await fn();else if(Array.isArray(fn))await L(...fn);else await say('me',fn)}
function itemClick(id){
  if(busy)return;
  const it=IT[id];
  if(sel){if(sel===id){sel=null;ui();return}run(()=>say('me',NOPE[(Math.random()*NOPE.length)|0]));return}
  if(verb==='use'){if(it.use)run(()=>exec(it.use));else{sel=id;verb=null;ui()}return}
  if(verb==='take'){run(()=>say('me',"Ce l'ho già in tasca."));return}
  if(verb==='talk'){run(()=>say('me',"Non parlo con gli oggetti. Non ancora."));return}
  run(()=>exec(it.look));
}
function doHot(h){
  const item=sel,v=item?'item':(verb||(h.exit?'use':h.actor?'talk':'look'));
  run(async()=>{
    const rm=rooms[S.room],r=rect(h),cx=h.actor?h.x:r[0]+r[2]/2;
    if(!rm.noPlayer){
      if(v!=='look'&&h.wx!==null){await walk(h.wx!=null?h.wx:h.actor?cx+(S.x<cx?-26:26):cx)}
      if(Math.abs(cx-S.x)>3)S.dir=cx>S.x?1:-1;
    }
    let fn;
    if(v==='item'){fn=h.item&&h.item[item];if(fn===undefined)fn=NOPE[(Math.random()*NOPE.length)|0]}
    else{fn=h[v];if(fn===undefined&&h.exit&&v!=='look')fn=h.use;if(fn===undefined)fn=DEF[v]}
    await exec(fn);
  });
}
function buildLabels(){
  labEl.innerHTML='';
  if(overlay)return;
  rooms[S.room].hs.forEach(h=>{if(!h.lab||!vis(h))return;const d=document.createElement('div');d.className='lab';d.textContent=h.lab;
    d.style.left=((h.r[0]+h.r[2]/2)/W*100)+'%';d.style.top=((h.labUp?h.r[1]-17:h.r[1]+h.r[3]+1)/H*100)+'%';labEl.append(d)});
}
$('#stage').addEventListener('click',e=>{if(skip){e.stopPropagation();e.preventDefault();skip()}},true);
document.addEventListener('keydown',e=>{if(skip&&(e.key===' '||e.key==='Enter'||e.key==='Escape'||e.key==='.')){e.preventDefault();skip()}});
scene.addEventListener('pointermove',e=>{if(busy||overlay)return;const h=hit(pt(e));if(h!==hover){hover=h;scene.style.cursor=h?'pointer':'crosshair';ui()}});
scene.addEventListener('pointerleave',()=>{hover=null;ui()});
scene.addEventListener('click',e=>{
  if(busy||!over.hidden)return;
  const p=pt(e),h=hit(p),rm=rooms[S.room];
  if(h){hover=h;doHot(h)}
  else{if(!rm.noPlayer)tx=clamp(p.x,rm.min,rm.max);verb=null;sel=null;ui()}
});
document.querySelectorAll('#verbs button').forEach(b=>b.onclick=()=>{if(busy)return;verb=verb===b.dataset.v?null:b.dataset.v;sel=null;ui()});

/* ---------- titolo, lettera finale ---------- */
function titolo(){
  const sv=load();
  over.innerHTML='<div><h1>CATASTROFI</h1><p>Un’avventura punta e clicca con il commissario Malversi</p><div class="btns"><button id="t-new">Nuova partita</button>'+(sv?'<button id="t-cont">Continua</button>':'')+'</div><p style="font-size:3.2cqw">Clicca sulla scena per muoverti e agire · un clic salta la battuta</p></div>';
  over.hidden=false;
  $('#t-new').onclick=()=>{S=fresh();bgc={};over.hidden=true;renderInv();run(()=>go('cucina',150))};
  if(sv)$('#t-cont').onclick=()=>{S=sv;bgc={};over.hidden=true;renderInv();run(()=>go(S.room,S.x))};
}
function lettera(){
  over.innerHTML='<div class="letter"><p>Caro Giacomo,</p>'+
    '<p>ti mando il primo risultato delle mie fatiche. Evito di commentare il fatto che tu sia rimasto l’unico uomo al mondo a non usare le mail e che io debba inviarti le pagine per posta, come faceva mio nonno.</p>'+
    '<p>So che mi avevi detto di scrivere in prima persona, ma il ruolo di narratore delle mie indagini mi piace molto di più e mi ha un po’ preso la mano. Alla fine ho dato a queste pagine anche un titolo, come se fosse davvero un piccolo romanzo giallo. Anche perché «Racconti di un depresso, prima puntata» mi faceva tristezza.</p>'+
    '<p>In ogni caso, io continuo a prendere i miei 25 mg di Valdoxan tutte le sere. Sai che mi fido ciecamente di te e della tua idea del diario terapeutico. Ma la strategia farmacologica per me avrà sempre il suo appeal, mi dispiace.</p>'+
    '<p>Ti abbraccio forte e con l’affetto di sempre.<br>Andrea</p>'+
    '<p class="blues">♪ When you got a good friend, that will stay right by your side, give her all of your spare time, love and treat her right.</p>'+
    '<small>Da «Catastrofi», prima parte di <i>Terapie</i> di Armando Bisogno (De Tomi Editore, 2024). Prototipo di avventura grafica: testi adattati dal romanzo.</small>'+
    '<div class="btns" style="margin-top:2cqw"><button id="t-again">Ricomincia</button></div></div>';
  over.hidden=false;over.scrollTop=0;
  $('#t-again').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();bgc={};renderInv();titolo()};
}

/* ---------- blues in dodici battute ---------- */
let AC=null,mOn=false,mTimer=null,mNext=0,mBar=0;
const PROG=[0,0,0,0,5,5,0,0,7,5,0,7];
function mNote(f,t,d,type,v){const o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function mSched(){
  while(mNext<AC.currentTime+.5){
    const root=82.41*Math.pow(2,PROG[mBar%12]/12),b=.54;
    for(let i=0;i<4;i++){const up=root*Math.pow(2,((i&1)?9:7)/12);
      for(let k=0;k<2;k++){const t=mNext+i*b+k*b*.66,d=k?b*.3:b*.58;mNote(root,t,d,'triangle',.15);mNote(up,t,d,'square',.03)}}
    mNext+=4*b;mBar++;
  }
}
$('#b-music').onclick=()=>{
  if(mOn){clearInterval(mTimer);mOn=false}
  else{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();mNext=AC.currentTime+.1;mBar=0;mTimer=setInterval(mSched,120);mOn=true}catch(e){}}
  $('#b-music').textContent='♪ blues: '+(mOn?'sì':'no');
};
let rz=0;
$('#b-reset').onclick=()=>{
  const b=$('#b-reset');
  if(Date.now()-rz<3000){rz=0;b.textContent='ricomincia';location.hash='';try{localStorage.removeItem(KEY)}catch(e){}
    if(skip)skip();setTimeout(()=>{busy=false;overlay=null;tx=null;um=null;chEl.hidden=true;S=fresh();bgc={};renderInv();ui();titolo()},300)}
  else{rz=Date.now();b.textContent='sicuro? clicca ancora';setTimeout(()=>{b.textContent='ricomincia'},3000)}
};

/* ---------- avvio ---------- */
function start(data){
  renderInv();ui();requestAnimationFrame(frame);
  if(data&&data.room&&rooms[data.room]){S=data;renderInv();run(()=>go(S.room,S.x))}
  else titolo();
}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>S)}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||null);
})();
</script>
