<!doctype html><html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1600px;height:2400px;overflow:hidden;background:#1c2329}
.wrap{position:relative;width:1600px;height:2400px;font-family:'Cormorant Garamond',Georgia,serif;color:#efe8dc}
svg{position:absolute;inset:0}
.top{position:absolute;top:150px;left:0;right:0;text-align:center;letter-spacing:.32em;font-size:40px;text-transform:uppercase;color:#c9bfae}
.title{position:absolute;top:1640px;left:0;right:0;text-align:center;font-size:190px;font-weight:500;line-height:1}
.sub{position:absolute;top:1870px;left:0;right:0;text-align:center;font-style:italic;font-size:58px;color:#d8cfbf}
.who{position:absolute;bottom:150px;left:0;right:0;text-align:center;font-size:42px;letter-spacing:.14em;color:#b9ae9c}
.who b{font-weight:500;color:#efe8dc;letter-spacing:.2em}
</style></head><body><div class="wrap">
<svg width="1600" height="2400" viewBox="0 0 1600 2400">
 <defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{GLASS_TOP}}"/><stop offset="1" stop-color="{{GLASS_BOTTOM}}"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#e9c98a" stop-opacity=".22"/><stop offset="1" stop-color="#e9c98a" stop-opacity="0"/></radialGradient>
  <clipPath id="win"><rect x="330" y="330" width="940" height="1140"/></clipPath>
 </defs>
 <rect width="1600" height="2400" fill="#1c2329"/>
 <rect width="1600" height="2400" fill="url(#glow)"/>
 <!-- vetro -->
 <rect x="330" y="330" width="940" height="1140" fill="url(#g)"/>
 <g clip-path="url(#win)">{{SCENE}}</g>
 <!-- telaio: tre vetri -->
 <g fill="none" stroke="#efe8dc" stroke-opacity=".88">
  <rect x="330" y="330" width="940" height="1140" stroke-width="22"/>
  <line x1="643" y1="330" x2="643" y2="1470" stroke-width="16"/>
  <line x1="957" y1="330" x2="957" y2="1470" stroke-width="16"/>
 </g>
 <!-- tazzina sul davanzale -->
 <rect x="290" y="1470" width="1020" height="26" fill="#efe8dc" fill-opacity=".88"/>
 <g transform="translate(470,1470)" fill="#efe8dc" fill-opacity=".9">
  <path d="M-46,-62 L46,-62 Q42,-6 0,-4 Q-42,-6 -46,-62 Z"/>
  <path d="M44,-50 q30,2 26,22 q-4,16 -30,12" fill="none" stroke="#efe8dc" stroke-width="8"/>
  <ellipse cx="0" cy="-2" rx="74" ry="9"/>
{{STEAM}}
 </g>
</svg>
<div class="top">Un esperimento di Macchine Pensanti</div>
<div class="title">Tre finestre</div>
<div class="sub">Il prologo di <span style="font-style:normal">{{ROMANZO}}</span> e tre sue riscritture</div>
<div class="who"><b>ARMANDO BISOGNO</b><br><span style="font-size:36px;line-height:2.2">alla maniera di {{AUTORI}}</span></div>
</div></body></html>
