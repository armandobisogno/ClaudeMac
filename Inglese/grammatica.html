<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grammatica Inglese</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: indice a sinistra come in una grammatica scolastica (paragrafi §), pagina della lezione a destra: regola sopra, esercizi sotto */
:root{
  --paper:#F5F6F2; --surface:#FFFFFF; --ink:#1B222B; --muted:#5A6470; --line:#D8DCD3;
  --accent:#24468F; --accent-soft:#E6ECF7; --mark:#F3E7A6; --ok:#2E7A4C; --ok-soft:#E3F2E8; --bad:#B03838; --bad-soft:#F8E5E3;
  --warn:#9A6400; --warn-soft:#FBEFD2; --warn-mark:#F2C25B; --order:#6B46B8; --order-soft:#EEE7FA;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161C; --surface:#1A2029; --ink:#E5E8EC; --muted:#9AA4B0; --line:#2C343F;
  --accent:#93B2F2; --accent-soft:#1F2B44; --mark:#4A4422; --ok:#6CC28E; --ok-soft:#18311F; --bad:#EE8580; --bad-soft:#3A1F1E; --warn:#E8B85A; --warn-soft:#3A2E14; --warn-mark:#8A6418; --order:#B9A0F2; --order-soft:#2A2142; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161C; --surface:#1A2029; --ink:#E5E8EC; --muted:#9AA4B0; --line:#2C343F;
  --accent:#93B2F2; --accent-soft:#1F2B44; --mark:#4A4422; --ok:#6CC28E; --ok-soft:#18311F; --bad:#EE8580; --bad-soft:#3A1F1E; --warn:#E8B85A; --warn-soft:#3A2E14; --warn-mark:#8A6418; --order:#B9A0F2; --order-soft:#2A2142; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* conversazione */
nav.idx a.conv{margin:4px -8px 6px;border:1px solid var(--line);background:var(--surface)}
nav.idx a.conv.on{background:var(--accent-soft)}
.conv-set{display:grid;gap:12px;margin-bottom:18px}
.conv-set .lab{font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-ui);font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scen-d{font-size:15px;color:var(--muted);margin:6px 0 0}
.conv-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conv-tools label{font-family:var(--f-ui);font-size:13.5px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:12px;margin:20px 0 8px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.55;font-size:16.5px;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.say{display:block;font-family:var(--f-ui);font-size:12.5px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;margin-top:6px}
.say:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.corr{align-self:flex-end;max-width:88%;font-family:var(--f-ui);font-size:13.5px;display:grid;gap:5px;line-height:1.7}
.corr .ok{color:var(--ok)}
.corr .better{color:var(--muted)}
.corr .better i{font-family:var(--f-body);font-size:15px;color:var(--ink)}
.corr a{color:var(--accent);margin-left:4px}
.tk.vo{background:var(--accent-soft);color:var(--accent)}
.typing{align-self:flex-start;font-family:var(--f-ui);font-size:13.5px;color:var(--muted)}
.composer{position:sticky;bottom:0;background:var(--paper);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);z-index:5}
.composer textarea{flex:1;min-width:0;font-family:var(--f-body);font-size:16px;line-height:1.45;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:none;min-height:46px;max-height:160px}
.composer textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.hint{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin:6px 0 0}
.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:18px}
.report h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 8px}
.report h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.report ul{margin:0;padding-left:20px}
.report a{color:var(--accent)}
.empty{color:var(--muted);font-size:16px;margin:8px 0 0}
body{font-family:var(--f-body);font-size:17px;line-height:1.6}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
nav.idx{border-right:1px solid var(--line);padding-block:28px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:18px;position:sticky;top:0;height:100vh;overflow-y:auto;font-family:var(--f-ui);font-size:14px}
.brand{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.overall{margin:0 0 20px}
.overall .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.overall .bar i{display:block;height:100%;background:var(--accent);width:0}
.overall small{color:var(--muted);display:block;margin-top:6px;font-variant-numeric:tabular-nums}
.unit{margin:18px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav.idx a{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px;align-items:baseline;padding:5px 8px;margin:0 -8px;border-radius:6px;color:var(--ink);text-decoration:none}
nav.idx a:hover{background:var(--accent-soft)}
nav.idx a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.idx a .n{color:var(--muted);font-variant-numeric:tabular-nums}
nav.idx a .b{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
nav.idx a .b.good{color:var(--ok);font-weight:600}
nav.idx a.rip{margin-top:14px;border:1px dashed var(--line)}
.topbar{display:none}
main{padding-block:36px 80px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px));min-width:0}
.page{max-width:780px;margin:0 auto}
.eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.6vw,44px);line-height:1.08;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 28px;font-size:18px}
.sec-h{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--accent);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.rule{margin-bottom:40px}
.rule h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:26px 0 8px}
.rule h3:first-child{margin-top:0}
.rule p{margin:0 0 12px;max-width:68ch}
.rule ul{margin:0 0 12px;padding-left:22px}
.rule li{margin-bottom:4px}
.rule b{font-weight:600}
.rule em.f, .rule .f{font-style:normal;background:var(--mark);padding:0 3px;border-radius:2px}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 18px;margin:6px 0 14px;padding:10px 14px;border-left:3px solid var(--line)}
.ex i{font-style:italic}
.ex span{color:var(--muted)}
.tw{overflow-x:auto;margin:8px 0 16px}
table.t{border-collapse:collapse;font-size:15px;min-width:100%}
table.t th,table.t td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.t td i{color:var(--muted)}
table.t caption{caption-side:top;text-align:left;font-family:var(--f-display);font-size:17px;padding:0 0 6px}
table.cj td{white-space:nowrap}
table.cj td.ps{font-family:var(--f-ui);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:4px}
table.cj tr.p3 td{background:var(--accent-soft)}
table.cj tr.pl1 td{border-top:2px solid var(--line)}
.nb{background:var(--accent-soft);padding:12px 16px;border-radius:8px;margin:14px 0;font-size:16px}
.nb::before{content:"Nota bene. ";font-family:var(--f-ui);font-weight:600;font-size:13px;color:var(--accent)}
/* esercizi */
.drill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px 24px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.btn{font-family:var(--f-ui);font-size:14px;font-weight:500;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{opacity:.9;color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,.opt:focus-visible,nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.src{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin:0 0 14px;min-height:18px}
ol.items{list-style:none;margin:0;padding:0;counter-reset:it;display:grid;gap:18px}
ol.items li{counter-increment:it;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px}
ol.items li::before{content:counter(it) ".";font-family:var(--f-ui);font-size:14px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.q{line-height:2.1}
.q input{font-family:var(--f-body);font-size:16px;border:none;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:0 4px;margin:0 2px;min-width:5ch;max-width:100%;border-radius:0}
.q input:focus{border-bottom-color:var(--accent);outline:none;background:var(--accent-soft)}
.wr input{display:block;width:100%;margin-top:6px;font-family:var(--f-body);font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{font-family:var(--f-body);font-size:15px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.ok-in{border-bottom-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad-in{border-bottom-color:var(--bad)!important;background:var(--bad-soft)!important}
.wr input.ok-in,.wr input.bad-in{border-color:currentColor}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.fb{font-family:var(--f-ui);font-size:13.5px;margin-top:6px;line-height:1.5}
.fb .y{color:var(--ok);font-weight:600}
.fb .n{color:var(--bad);font-weight:600}
.fb .ans{font-family:var(--f-body);font-size:15px}
.fb .why{color:var(--muted);margin-top:2px}
.fb .w{color:var(--warn);font-weight:600}
.fb .dl{margin-top:4px;line-height:2}
.fb .lab{color:var(--muted)}
.diff{font-family:var(--f-body);font-size:15.5px}
.tk{padding:1px 3px;border-radius:3px;white-space:nowrap}
.tk.ok{color:var(--ok)}
.tk.sp{background:var(--warn-soft);color:var(--ink)}
.tk.sp mark{background:var(--warn-mark);color:var(--ink);border-radius:2px;padding:0 1px}
.tk.gr,.tk.ex{background:var(--bad-soft);color:var(--bad)}
.tk.mi{border:1px dashed var(--bad);color:var(--bad)}
.tk.or{background:var(--order-soft);color:var(--order)}
.tk .fix{font-family:var(--f-ui);font-size:12px;font-weight:600;margin-left:4px}
.tk.sp .fix{color:var(--warn)}
.warn-in{border-bottom-color:var(--warn)!important;background:var(--warn-soft)!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);width:100%}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.check-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.score{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.score small{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-left:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;font-family:var(--f-ui);font-size:14px}
.pager a{color:var(--accent);text-decoration:none;max-width:48%}
.pager a:hover{text-decoration:underline}
.busy{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.busy{animation:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.idx{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);height:100%;z-index:20;background:var(--paper);transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top, 0px));box-shadow:0 0 0 100vmax transparent}
  nav.idx.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));align-items:center;gap:12px;font-family:var(--f-ui)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
  .topbar b{font-family:var(--f-display);font-weight:400;font-size:18px}
  main{padding-block:24px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .drill{padding:18px 16px}
  .ex{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="topbar"><button class="btn" id="menuBtn" aria-controls="idx">Indice</button><b>Grammatica Inglese</b></div>
<div class="app">
  <nav class="idx" id="idx" aria-label="Indice delle lezioni">
    <p class="brand">Grammatica Inglese</p>
    <p class="brand-sub">Regole ed esercizi, paragrafo per paragrafo</p>
    <div class="overall"><div class="bar"><i id="ovBar"></i></div><small id="ovTxt">0 lezioni su 25 esercitate</small></div>
    <div id="toc"></div>
  </nav>
  <main><div class="page" id="page"></div></main>
</div>

<script>
/* ---------- utilità ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sampleN=(a,n)=>shuffle(a).slice(0,n);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const alt=s=>String(s).split('|');
const gap=(q,a,ex)=>({t:'gap',q,a:a.map(x=>Array.isArray(x)?x:alt(x)),ex});
const choice=(q,o,a,ex)=>({t:'choice',q,o:shuffle(o),a,ex});
const write=(q,a,ex)=>({t:'write',q,a:Array.isArray(a)?a:alt(a),ex});
function build(spec){ // spec: [[quante, fn], ...]
  const out=[],seen=new Set();
  for(const [n,fn] of spec){let k=0,tries=0;while(k<n&&tries<60){tries++;const it=fn();if(!it||seen.has(it.q))continue;seen.add(it.q);out.push(it);k++}}
  return out;
}

/* ---------- morfologia ---------- */
const s3=b=>{if(b==='have')return'has';if(/(s|x|z|ch|sh|o)$/.test(b))return b+'es';if(/[^aeiou]y$/.test(b))return b.slice(0,-1)+'ies';return b+'s'};
const ing=(b,d)=>{const w=b.split(' '),v=w[0];let r;if(v.endsWith('ie'))r=v.slice(0,-2)+'ying';else if(d)r=v+v.slice(-1)+'ing';else if(/[^aeiouy]e$/.test(v)&&v!=='be')r=v.slice(0,-1)+'ing';else r=v+'ing';w[0]=r;return w.join(' ')};
const ed=(b,d)=>{if(b.endsWith('e'))return b+'d';if(/[^aeiou]y$/.test(b))return b.slice(0,-1)+'ied';if(d)return b+b.slice(-1)+'ed';return b+'ed'};

const V=[ // base, past, pp, italiano, complementi, raddoppio

 ['carry',0,0,'portare',['a heavy bag','the shopping']],
 ['listen',0,0,'ascoltare',['to music','to the radio']],
 ['arrive',0,0,'arrivare',['late','at the office at eight']],
 ['use',0,0,'usare',['the computer','a dictionary']],
 ['help',0,0,'aiutare',['my brother','in the garden']],
 ['call',0,0,'chiamare',['my mother','a taxi']],
 ['dance',0,0,'ballare',['at parties','salsa']],
 ['shop',0,0,'fare acquisti',['online','at the market'],1],
 ['plan',0,0,'pianificare',['the holidays','the meeting'],1],

 ['go','went','gone','andare',['to the gym','to bed early','to the cinema']],
 ['have','had','had','avere / fare',['breakfast at seven','a shower','lunch with friends']],
 ['eat','ate','eaten','mangiare',['pasta','a sandwich','fruit']],
 ['drink','drank','drunk','bere',['coffee','green tea']],
 ['write','wrote','written','scrivere',['emails','a letter','in my diary']],
 ['read','read','read','leggere',['the newspaper','a novel']],
 ['speak','spoke','spoken','parlare',['French','to the manager']],
 ['take','took','taken','prendere',['the bus','photos']],

 ['buy','bought','bought','comprare',['bread','fresh fish']],
 ['see','saw','seen','vedere',['the doctor','a film']],

 ['get','got','got','alzarsi / prendere',['up early','a taxi home'],1],
 ['run','ran','run','correre',['in the park','five kilometres'],1],
 ['swim','swam','swum','nuotare',['in the sea','in the pool'],1],

<h3>Articolo indeterminativo: <i>a / an</i></h3>
<p>Si usa con i nomi <b>numerabili singolari</b>: quando si nomina qualcosa per la prima volta, e sempre con le professioni. La scelta fra <i>a</i> e <i>an</i> dipende dal <b>suono</b> iniziale della parola seguente, non dalla lettera.</p>
<div class="tw"><table class="t"><tr><th>a + suono consonantico</th><th>an + suono vocalico</th></tr>
<tr><td>a book, a car</td><td>an apple, an egg</td></tr>
<tr><td>a <b>u</b>niversity, a <b>u</b>niform <i>(/ju:/)</i></td><td>an <b>h</b>our, an <b>h</b>onest man <i>(h muta)</i></td></tr>
<tr><td>a <b>Eu</b>ropean, a <b>o</b>ne-way ticket</td><td>an <b>u</b>mbrella, an <b>u</b>nusual name</td></tr></table></div>
<div class="ex"><i>She's an engineer.</i><span>È ingegnere.</span><i>Twice a week.</i><span>Due volte alla settimana.</span></div>
<h3>Articolo determinativo: <i>the</i></h3>
<ul><li>cosa già nominata o nota a chi ascolta: <i>I saw a film. <span class="f">The</span> film was long.</i></li>
<li>cosa unica: <i>the sun, the capital of Italy</i>; con il superlativo: <i>the best</i></li>
<li>strumenti musicali: <i>play the piano</i></li>
<li>fiumi, mari, catene montuose, stati al plurale: <i>the Thames, the Alps, the United States</i></li></ul>
<h3>Articolo zero</h3>
<p>Qui l'inglese si separa dall'italiano. <b>Nessun articolo</b> con:</p>
<ul><li>plurali e non numerabili in senso generale: <i>I like dogs. Music is important.</i> (mi piacciono <u>i</u> cani; <u>la</u> musica)</li>
<li>pasti, sport e giochi: <i>have lunch, play tennis</i></li>
<li><i>by</i> + mezzo di trasporto: <i>by bus, by train</i></li>
<li>nomi propri, città, quasi tutti i paesi, montagne singole: <i>Rome, Italy, Mount Everest</i></li>

<h3>Regola generale</h3><p>Il plurale si forma aggiungendo <span class="f">-s</span>: <i>book → books, car → cars</i>.</p>

<tr><td>-o</td><td>+ -es in alcuni nomi comuni</td><td>potato → potatoes, tomato → tomatoes, hero → heroes <i>(ma photo → photos, piano → pianos)</i></td></tr></table></div>
<h3>Plurali irregolari</h3><p>Resti dell'antico inglese, come le declinazioni «difficili» del latino: vanno imparati a memoria.</p>

<h3>Due classi di nomi</h3>
<p>I nomi <b>numerabili</b> (countable) hanno singolare e plurale: <i>an egg, two eggs</i>. I <b>non numerabili</b> (uncountable) non hanno plurale e non prendono <i>a/an</i>: <i>water, money, bread</i>.</p>
<p>Attenzione ai «falsi amici» grammaticali: in inglese sono non numerabili <i>information, advice, news, furniture, luggage, homework</i>. Per contarli si usa un'unità: <i>a piece of advice</i>.</p>
<h3>Quantificatori</h3>
<div class="tw"><table class="t"><tr><th></th><th>Numerabili plurali</th><th>Non numerabili</th></tr>

<p class="nb">Nelle offerte e richieste cortesi si usa <i>some</i> anche nella domanda: <i>Would you like some tea?</i> Nelle frasi affermative <i>much</i> suona formale: si preferisce <i>a lot of</i>.</p>`,

<h3>Il paradigma</h3>

<li>Il pronome possessivo sostituisce aggettivo + nome: <i>This book is <b>mine</b></i>.</li></ul>
<p class="nb"><i>Its</i> (possessivo) non ha apostrofo; <i>it's</i> = <i>it is / it has</i>.</p>`,

 [2,()=>{const k=pick(Object.keys(PR));return gap(`Is this ___ (${k}) umbrella?`,[PR[k][2]],'Aggettivo possessivo davanti al nome, senza articolo.')}],
 [2,()=>{const k=pick(Object.keys(PR).filter(x=>x!=='it'));return gap(`That umbrella is ___ (${k}).`,[PR[k][3]],'Pronome possessivo: sostituisce aggettivo + nome.')}]])});

/* §6 Riflessivi */
const RS=[['I','myself'],['You','yourself|yourselves'],['He','himself'],['She','herself'],['We','ourselves'],['They','themselves'],['My brother','himself'],['The children','themselves'],['Anna','herself']];
const RT=['hurt ___ while cooking.','enjoyed ___ at the party.','looked at ___ in the mirror.','taught ___ to play the guitar.','built the bookshelf ___.','introduced ___ to the new neighbours.'];
const EACH=[["Tom and Anna love ___ very much.",'each other'],["The two neighbours never speak to ___.",'each other'],["The children dressed ___ without any help.",'themselves'],["We introduced ___ to the new teacher.",'ourselves'],["My sister and I phone ___ every day.",'each other'],["They blamed ___ for the accident.",'themselves']];
L.push({unit:'II',title:'Pronomi riflessivi',sub:'myself, yourself… ed each other',rule:`
<h3>Forme</h3>
<div class="tw"><table class="t"><tr><th>Singolare</th><th>Plurale</th></tr>
<tr><td>myself</td><td>ourselves</td></tr><tr><td>yourself</td><td>yourselves</td></tr><tr><td>himself / herself / itself</td><td>themselves</td></tr></table></div>
<h3>Usi</h3>
<ul><li><b>Riflessivo</b>: soggetto e oggetto coincidono. <i>She hurt <b>herself</b>.</i> (Si è fatta male.)</li>
<li><b>Enfatico</b>: «da solo, proprio io». <i>I made the cake <b>myself</b>.</i></li>
<li><b>by + riflessivo</b> = da solo, senza compagnia o aiuto: <i>He lives by himself.</i></li></ul>
<p>Molti verbi riflessivi in italiano <b>non</b> lo sono in inglese: <i>get up</i> (alzarsi), <i>wash</i> (lavarsi), <i>feel</i> (sentirsi), <i>relax</i> (rilassarsi), <i>remember</i> (ricordarsi).</p>
<h3>Reciproco: <i>each other</i></h3>
<p>Quando l'azione è scambievole fra due o più persone: <i>Tom and Anna love <b>each other</b></i> (si amano l'un l'altro). Confronta: <i>They blamed themselves</i> (ciascuno sé stesso).</p>`,
gen:()=>build([[6,()=>{const [s,r]=pick(RS);return gap(`${s} ${pick(RT)}`,[r],'Il riflessivo concorda con il soggetto.')}],
 [2,()=>{const [q,a]=pick(EACH);return choice(q,['each other','themselves','ourselves'],a,a==='each other'?'Azione reciproca: each other.':'Azione rivolta al soggetto stesso: riflessivo.')}]])});

/* §7 Relativi */
const RP=['the woman','the man','the doctor','the students','the girl'], RPC=['lives next door','called you yesterday','teaches us English','won the competition'];
const RT2=['the book','the car','the film','the keys','the photo'], RTC=['is on the table','I bought last week','we saw on Saturday','was in the drawer'];
const RW=['car was stolen','dog barks all night','father is a pilot','house is for sale'];
const RWH=[['the town','I grew up'],['the hotel','we stayed'],['the restaurant','we had dinner'],['the office','she works']];
L.push({unit:'II',title:'I pronomi relativi',sub:'who, which, that, whose, where',rule:`
<h3>Il quadro</h3>
<div class="tw"><table class="t"><tr><th>Antecedente</th><th>Pronome</th><th>Esempio</th></tr>
<tr><td>persona</td><td><b>who</b> (o that)</td><td>the woman <b>who</b> lives next door</td></tr>
<tr><td>cosa, animale</td><td><b>which</b> (o that)</td><td>the book <b>which</b> is on the table</td></tr>
<tr><td>possesso («il cui»)</td><td><b>whose</b></td><td>the man <b>whose</b> car was stolen</td></tr>
<tr><td>luogo («dove, in cui»)</td><td><b>where</b></td><td>the town <b>where</b> I grew up</td></tr></table></div>
<h3>Relative determinative e non determinative</h3>
<p>Le <b>determinative</b> identificano di chi o di che cosa si parla; non hanno virgole e ammettono <i>that</i>. Quando il relativo è <b>complemento oggetto</b> si può omettere: <i>the book (that) I bought</i>.</p>
<p>Le <b>non determinative</b> aggiungono un'informazione accessoria fra virgole; non ammettono <i>that</i> e il relativo non si omette: <i>My brother, <b>who</b> lives in Milan, is a doctor.</i></p>
<p class="nb">La preposizione nell'inglese parlato va in fondo: <i>the girl (who) I was talking <b>to</b></i>. Nello stile formale: <i>the girl <b>to whom</b> I was talking</i>.</p>`,
gen:()=>build([
 [3,()=>choice(`I know ${pick(RP)} ___ ${pick(RPC)}.`,['who','which','whose','where'],'who','Antecedente persona: who (anche that).')],
 [2,()=>choice(`Where's ${pick(RT2)} ___ ${pick(RTC)}?`,['who','which','whose','where'],'which','Antecedente cosa: which (anche that).')],
 [2,()=>choice(`That's ${pick(RP)} ___ ${pick(RW)}.`,['who','which','whose','where'],'whose','Possesso: whose + nome.')],
 [1,()=>{const [a,c]=pick(RWH);return choice(`This is ${a} ___ ${c}.`,['who','which','whose','where'],'where','Luogo: where.')}]])});

/* §8 Comparativi e superlativi */
const ADJ=[['big','bigger','biggest','house'],['small','smaller','smallest','room'],['tall','taller','tallest','building'],['old','older','oldest','church'],['cheap','cheaper','cheapest','hotel'],['expensive','more expensive','most expensive','restaurant'],['beautiful','more beautiful','most beautiful','beach'],['good','better','best','pizzeria'],['bad','worse','worst','film'],['far','farther|further','farthest|furthest','village'],['happy','happier','happiest','child'],['easy','easier','easiest','exercise'],['busy','busier','busiest','street'],['hot','hotter','hottest','summer'],['thin','thinner','thinnest','book'],['nice','nicer','nicest','café'],['large','larger','largest','park'],['interesting','more interesting','most interesting','museum'],['difficult','more difficult','most difficult','question'],['comfortable','more comfortable','most comfortable','chair'],['quiet','quieter','quietest','neighbourhood'],['modern','more modern','most modern','stadium'],['famous','more famous','most famous','singer'],['dangerous','more dangerous','most dangerous','road'],['heavy','heavier','heaviest','suitcase'],['funny','funnier','funniest','joke'],['safe','safer','safest','car'],['fast','faster','fastest','train'],['narrow','narrower','narrowest','street'],['clever','cleverer|more clever','cleverest|most clever','student']];
const adjEx=(a,c)=>{if(['good','bad','far'].includes(a))return'Forma irregolare.';if(c.startsWith('more'))return'Aggettivo lungo (2+ sillabe): more / the most.';if(/[^aeiou][aeiou][^aeiouwy]$/.test(a)&&/(.)\1er/.test(c))return'Monosillabo CVC: raddoppia la consonante.';if(/y$/.test(a))return'-y → -ier / -iest.';if(/e$/.test(a))return'Termina in -e: solo -r / -st.';return'Monosillabo: -er / -est.'};
L.push({unit:'III',title:'Comparativi e superlativi',sub:'-er / -est, more / most e le forme irregolari',rule:`
<h3>Formazione</h3>
<div class="tw"><table class="t"><tr><th>Aggettivo</th><th>Comparativo</th><th>Superlativo</th></tr>
<tr><td>una sillaba: <i>cheap</i></td><td>cheap<b>er</b></td><td>the cheap<b>est</b></td></tr>
<tr><td>in -e: <i>nice</i></td><td>nice<b>r</b></td><td>the nice<b>st</b></td></tr>
<tr><td>consonante-vocale-consonante: <i>big</i></td><td>bi<b>gg</b>er</td><td>the bi<b>gg</b>est</td></tr>
<tr><td>due sillabe in -y: <i>happy</i></td><td>happ<b>ier</b></td><td>the happ<b>iest</b></td></tr>
<tr><td>due o più sillabe: <i>expensive</i></td><td><b>more</b> expensive</td><td>the <b>most</b> expensive</td></tr></table></div>
<h3>Irregolari</h3>
<div class="tw"><table class="t"><tr><th>Grado positivo</th><th>Comparativo</th><th>Superlativo</th></tr>
<tr><td>good</td><td>better</td><td>the best</td></tr><tr><td>bad</td><td>worse</td><td>the worst</td></tr><tr><td>far</td><td>farther / further</td><td>the farthest / furthest</td></tr>
<tr><td>much / many</td><td>more</td><td>the most</td></tr><tr><td>little</td><td>less</td><td>the least</td></tr></table></div>
<h3>Costruzioni</h3>
<ul><li>Comparativo di maggioranza + <b>than</b>: <i>Rome is bigger <b>than</b> Florence.</i></li>
<li>Uguaglianza <b>as … as</b>: <i>She's <b>as</b> tall <b>as</b> her mother.</i> Negativa: <i>not as … as</i>.</li>
<li>Superlativo con <b>the</b>, seguito da <b>in</b> per i luoghi e i gruppi: <i>the tallest building <b>in</b> the city</i>; <b>of</b> per periodi e gruppi numerati: <i>the best day <b>of</b> my life</i>.</li></ul>`,
gen:()=>build([
 [4,()=>{const [a,c,,n]=pick(ADJ);return gap(`This ${n} is ___ (${a}) than the other one.`,[c],adjEx(a,c))}],
 [4,()=>{const [a,c,s,n]=pick(ADJ);return gap(`It's the ___ (${a}) ${n} I know.`,[s],adjEx(a,c))}]])});

/* §9 Avverbi */
const ADV=[['careful','carefully'],['quick','quickly'],['slow','slowly'],['good','well'],['bad','badly'],['fast','fast'],['hard','hard'],['beautiful','beautifully'],['quiet','quietly'],['terrible','terribly'],['loud','loudly'],['elegant','elegantly'],['easy','easily'],['happy','happily'],['gentle','gently'],['nervous','nervously']];
const AG=[['drives','driver'],['works','worker'],['sings','singer'],['plays','player'],['cooks','cook'],['swims','swimmer'],['dances','dancer'],['writes','writer']];
const advEx=(a,d)=>a===d?`${a}: aggettivo e avverbio hanno la stessa forma.`:a==='good'?'Good → well (irregolare).':/le$/.test(a)?'-le → -ly.':/y$/.test(a)?'-y → -ily.':'Aggettivo + -ly.';
L.push({unit:'III',title:'Gli avverbi di modo',sub:'aggettivo o avverbio? la desinenza -ly',rule:`
<h3>Aggettivo o avverbio</h3>
<p>L'<b>aggettivo</b> descrive un nome (<i>a <b>careful</b> driver</i>); l'<b>avverbio</b> descrive un verbo, cioè il <i>modo</i> dell'azione (<i>he drives <b>carefully</b></i>). Dopo i verbi di stato (<i>be, look, seem, feel, taste, sound</i>) si usa l'aggettivo: <i>You look <b>tired</b>.</i></p>
<h3>Formazione</h3>
<div class="tw"><table class="t"><tr><th>Aggettivo</th><th>Regola</th><th>Avverbio</th></tr>
<tr><td>quick, careful</td><td>+ -ly</td><td>quickly, carefully</td></tr>
<tr><td>easy, happy</td><td>-y → -ily</td><td>easily, happily</td></tr>
<tr><td>terrible, gentle</td><td>-le → -ly</td><td>terribly, gently</td></tr>
<tr><td>good</td><td>irregolare</td><td><b>well</b></td></tr>
<tr><td>fast, hard, late, early</td><td>forma identica</td><td>fast, hard, late, early</td></tr></table></div>
<p class="nb"><i>Hardly</i> e <i>lately</i> esistono, ma significano altro: <i>hardly</i> = a malapena, <i>lately</i> = ultimamente.</p>
<h3>Posizione</h3><p>L'avverbio di modo va <b>dopo il verbo e l'eventuale complemento oggetto</b>, mai fra verbo e oggetto: <i>She speaks English <b>fluently</b></i> (non <s>speaks fluently English</s>).</p>`,
gen:()=>build([
 [5,()=>{const [a,d]=pick(ADV),[v]=pick(AG);return gap(`${pick(['Anna','My brother','Tom','Our teacher'])} ${v} ___ (${a}).`,[d],'Descrive il verbo: avverbio. '+advEx(a,d))}],
 [3,()=>{const [a]=pick(ADV),[,n]=pick(AG);return gap(`${pick(['Anna','My brother','Tom','Our teacher'])} is a very ___ (${a}) ${n}.`,[a],'Descrive un nome: aggettivo.')}]])});

/* §10 Be e have got */
const BEC=['tired today','from Italy','at home now','very happy','late again','in the garden'];
const HGC=['two brothers','a new car','blue eyes','a bad cold','a lot of homework'];
L.push({unit:'IV',title:'Essere e avere',sub:'be, have got, there is / there are',rule:`
<h3>Il verbo <i>be</i> al presente</h3>
${cj('Indicativo presente di <i>be</i>',[['Affermativa',(pr,p)=>`${pr} <b>${BE(p)}</b>`],['Contratta',ctr],['Negativa',(pr,p)=>`${pr} ${BENEG(p)}`],['Interrogativa',(pr,p)=>Q(BE(p),pr)]])}
${cj('Past simple di <i>be</i>',[['Affermativa',(pr,p)=>`${pr} <b>${WAS(p)}</b>`],['Negativa',(pr,p)=>`${pr} ${WAS(p)}n't`],['Interrogativa',(pr,p)=>Q(WAS(p),pr)]])}
<p>Molte espressioni italiane con <i>avere</i> in inglese vogliono <i>be</i>: <i>I'm hungry</i> (ho fame), <i>I'm cold</i> (ho freddo), <i>I'm 30</i> (ho trent'anni), <i>you're right</i> (hai ragione).</p>
<h3><i>Have got</i></h3>
<p>Per il possesso, nell'inglese britannico:</p>
${cj('<i>Have got</i>',[['Affermativa',(pr,p)=>`${pr} <b>${HAS(p)}</b> got`],['Negativa',(pr,p)=>`${pr} ${HAS(p)}n't got`],['Interrogativa',(pr,p)=>Q(HAS(p),pr,'got')]])}
<p>In alternativa <i>have</i> con l'ausiliare <i>do</i>: <i>Do you have a car?</i></p>
<h3><i>There is / there are</i></h3>
<p>«C'è / ci sono»: <i>There <b>is</b> a cat</i> (singolare e non numerabili), <i>There <b>are</b> two cats</i> (plurale).</p>`,
gen:()=>build([
 [2,()=>{const s=subj();return gap(`${s.s} ___ (be) ${pick(BEC)}.`,[BE(s.p)],`${s.s}: ${BE(s.p)}.`)}],
 [2,()=>{const s=subj();return gap(`${s.s} ___ (not be) ${pick(BEC)}.`,[BENEG(s.p)],`Negativa: ${BE(s.p)} + not.`)}],
 [1,()=>{const s=subj();return gap(`___ (be) ${mid(s.s)} ${pick(['ready','hungry','at work','cold'])}?`,[BE(s.p)],'Domanda: il verbo be va prima del soggetto.')}],
 [2,()=>{const s=subj(),n=Math.random()<.5;return gap(`${s.s} ___ (${n?'not ':''}have got) ${pick(HGC)}.`,[n?`${HAS(s.p)}n't got`:`${HAS(s.p)} got`],s.p==='3s'?'Terza persona singolare: has got.':'Have got per tutte le persone tranne la terza singolare.')}],
 [1,()=>{const [n,b]=pick([['a cat','is'],['two cats','are'],['some milk','is'],['a lot of people','are'],['any chairs','are'],['a problem','is']]);const neg=n.startsWith('any');return gap(`There ___ (${neg?'not ':''}be) ${n} here.`,[neg?"aren't":b],'There is + singolare/non numerabile, there are + plurale.')}]])});

/* §11 Present simple */
const FREQ=['usually','often','sometimes','always'];
L.push({unit:'IV',title:'Il present simple',sub:'abitudini, fatti generali, la -s della terza persona',rule:`
<h3>Uso</h3>
<p>Azioni <b>abituali</b> e ripetute, fatti generali e permanenti: <i>I <b>work</b> in a bank. Water <b>boils</b> at 100 °C.</i> Lo accompagnano gli avverbi di frequenza (<i>always, usually, often, sometimes, never</i>), che si collocano <b>prima del verbo</b> ma <b>dopo</b> <i>be</i>: <i>She <b>often</b> plays tennis. She is <b>often</b> late.</i></p>
<h3>Forma</h3>
${cj('Present simple di <i>play</i>',[['Affermativa',(pr,p)=>`${pr} play${p==='3s'?'<b>s</b>':''}`],['Negativa',(pr,p)=>`${pr} <b>${DO(p)}n't</b> play`],['Interrogativa',(pr,p)=>Q(DO(p),pr,'play')]])}
<p>Con <i>does / doesn't</i> la <b>-s</b> passa all'ausiliare e il verbo torna alla forma base: <i>Does she play?</i> (non <s>Does she plays?</s>)</p>
<h3>Ortografia della terza persona</h3>
<div class="tw"><table class="t"><tr><th>Terminazione</th><th>Regola</th><th>Esempi</th></tr>
<tr><td>-s, -x, -ch, -sh, -o</td><td>+ -es</td><td>watches, washes, goes, does</td></tr>
<tr><td>consonante + y</td><td>-ies</td><td>study → studies, carry → carries</td></tr>
<tr><td>vocale + y</td><td>+ -s</td><td>play → plays</td></tr>
<tr><td><i>have</i></td><td>irregolare</td><td>has</td></tr></table></div>`,
gen:()=>build([
 [4,()=>{const s=subj(),v=pick(V);return gap(`${s.s} ${pick(FREQ)} ___ (${v.b}) ${vc(v)}.`,[PRES(v.b,s.p)],s.p==='3s'?`Terza persona singolare: ${s3(v.b)}.`:'Forma base: nessuna -s.')}],
 [2,()=>{const s=subj(),v=pick(V);return gap(`${s.s} ___ (not ${v.b}) ${vc(v)}.`,[`${DO(s.p)}n't ${v.b}`],`Negativa: ${DO(s.p)} not + forma base.`)}],
 [2,()=>{const s=subj(notI),v=pick(V),c=vc(v);return write(`Volgi in forma interrogativa: ${s.s} ${PRES(v.b,s.p)} ${c}.`,[`${cap(DO(s.p))} ${mid(s.s)} ${v.b} ${c}?`],`${cap(DO(s.p))} + soggetto + forma base.`)}]])});

/* §12 Present continuous */
const STAT=[['want','a cup of tea'],['need','some help'],['like','this song'],['know','the answer'],['understand','the problem'],['believe','you']];
L.push({unit:'IV',title:'Il present continuous',sub:'azioni in corso e confronto con il present simple',rule:`
<h3>Forma</h3>
<p><b>be</b> (am / is / are) + verbo in <b>-ing</b>.</p>
${cj('Present continuous di <i>work</i>',[['Affermativa',(pr,p)=>`${pr} <b>${BE(p)}</b> work<b>ing</b>`],['Negativa',(pr,p)=>`${pr} ${BENEG(p)} working`],['Interrogativa',(pr,p)=>Q(BE(p),pr,'working')]])}
<h3>Uso</h3>
<ul><li>azione in corso <b>adesso</b>: <i>Look! It's raining.</i></li>
<li>situazione temporanea: <i>I'm living with friends this month.</i></li>
<li>programmi già fissati per il futuro (vedi § 18): <i>I'm meeting Sarah tonight.</i></li></ul>
<div class="tw"><table class="t"><tr><th>Present simple</th><th>Present continuous</th></tr>
<tr><td>every day, usually, on Mondays, twice a week</td><td>now, right now, at the moment, this week, Look!, Listen!</td></tr>
<tr><td><i>She works from home on Fridays.</i></td><td><i>She's working from home today.</i></td></tr></table></div>
<h3>Ortografia di -ing</h3>
<div class="tw"><table class="t"><tr><th>Regola</th><th>Esempi</th></tr>
<tr><td>-e muta cade</td><td>make → making, write → writing</td></tr>
<tr><td>-ie → -ying</td><td>lie → lying, die → dying</td></tr>
<tr><td>monosillabo consonante-vocale-consonante: raddoppio</td><td>swim → swimming, run → running, stop → stopping</td></tr></table></div>
<p class="nb">I <b>verbi di stato</b> (<i>like, love, want, need, know, understand, believe, belong</i>) normalmente non hanno la forma continua: <i>I <b>want</b> a coffee now</i> (non <s>I'm wanting</s>).</p>`,
gen:()=>build([
 [3,()=>{const s=subj(),v=pick(V),m=pick(['Look!','Listen!','Right now','At the moment']);const head=m.endsWith('!')?`${m} ${s.s}`:`${m} ${mid(s.s)}`;return gap(`${head} ___ (${v.b}) ${vc(v)}.`,[`${BE(s.p)} ${ing(v.b,v.d)}`],`Azione in corso: ${BE(s.p)} + ${ing(v.b,v.d)}.`)}],
 [1,()=>{const s=subj(),v=pick(V);return gap(`${s.s} ___ (not ${v.b}) ${vc(v)} at the moment.`,[`${BENEG(s.p)} ${ing(v.b,v.d)}`],'Negativa: be + not + -ing.')}],
 [3,()=>{const s=subj(),v=pick(V),cont=Math.random()<.5;const m=cont?pick(['now','right now','at the moment']):pick(['every weekend','on Mondays','twice a week']);
   return gap(`${s.s} ___ (${v.b}) ${vc(v)} ${m}.`,[cont?`${BE(s.p)} ${ing(v.b,v.d)}`:PRES(v.b,s.p)],cont?`«${m}»: present continuous.`:`«${m}»: azione abituale, present simple.`)}],
 [1,()=>{const s=subj(),[v,c]=pick(STAT);return gap(`${s.s} ___ (${v}) ${c} right now.`,[PRES(v,s.p)],`${v} è un verbo di stato: present simple anche con «now».`)}]])});

/* §13 Past simple regolare */
const PT=['yesterday','last week','two days ago','last night','in 2020','last summer'];
L.push({unit:'IV',title:'Il past simple (verbi regolari)',sub:'il passato concluso, -ed e did',rule:`
<h3>Uso</h3>
<p>Azione <b>conclusa</b> in un momento <b>definito</b> del passato. Corrisponde al passato prossimo e al passato remoto italiani: <i>I <b>visited</b> Rome last year</i> (ho visitato / visitai).</p>
<p>Espressioni tipiche: <i>yesterday, last week, two days ago, in 2020, when I was a child</i>.</p>
<h3>Forma</h3>
${cj('Past simple di <i>work</i>',[['Affermativa',(pr)=>`${pr} work<b>ed</b>`],['Negativa',(pr)=>`${pr} <b>didn't</b> work`],['Interrogativa',(pr)=>Q('did',pr,'work')]])}
<p>La forma è <b>uguale per tutte le persone</b>. Con <i>did / didn't</i> il verbo torna alla forma base: <i>Did you watch…?</i> (non <s>Did you watched</s>).</p>
<h3>Ortografia di -ed</h3>
<div class="tw"><table class="t"><tr><th>Regola</th><th>Esempi</th></tr>
<tr><td>verbo in -e: + d</td><td>live → lived, arrive → arrived</td></tr>
<tr><td>consonante + y → -ied</td><td>study → studied, carry → carried</td></tr>

<h3>Il paradigma</h3>
<p>Come in latino si impara <i>amo, amas, amavi, amatum, amare</i>, in inglese si memorizzano i <b>tre tempi principali</b>: forma base, past simple, participio passato. Il past simple serve al passato (§ 13); il participio ai tempi composti (§ 16–17) e al passivo (§ 21).</p>
<h3>Quattro classi</h3>
<div class="tw"><table class="t"><tr><th>Schema</th><th>Esempi</th></tr>
<tr><td><b>A – A – A</b> (tre forme uguali)</td><td>cut – cut – cut; put, let, hit, shut, cost, hurt</td></tr>
<tr><td><b>A – B – B</b> (past = participio)</td><td>buy – bought – bought; bring, think, teach, catch, make, sell, tell, find, keep, sleep</td></tr>
<tr><td><b>A – B – A</b> (participio = base)</td><td>come – came – come; become, run</td></tr>
<tr><td><b>A – B – C</b> (tre forme diverse)</td><td>write – wrote – written; go – went – gone; see – saw – seen; take – took – taken</td></tr></table></div>
<p>Dentro le classi ci sono famiglie che aiutano la memoria: <i>sing – sang – sung</i> come <i>ring, drink, swim, sink</i>; <i>know – knew – known</i> come <i>grow, throw, blow, fly (flew, flown)</i>; <i>buy, bring, think, fight, catch, teach</i> fanno tutti <i>-ought / -aught</i>.</p>
<h3>Tavola</h3>
<div class="tw"><table class="t"><tr><th>Base</th><th>Past simple</th><th>Participio</th><th>Significato</th></tr>
${IRR.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1].replace('|',' / ')}</td><td>${r[2].replace('|',' / ')}</td><td><i>${r[3]}</i></td></tr>`).join('')}</table></div>
<p class="nb">Le forme in <i>-t</i> (<i>learnt, dreamt, burnt</i>) sono britanniche; l'americano preferisce <i>learned, dreamed, burned</i>. Sono corrette entrambe.</p>`,

<h3>L'ordine della frase</h3>
<p>La frase affermativa inglese ha un ordine rigido: <b>soggetto – verbo – oggetto – modo – luogo – tempo</b>. <i>She plays the piano beautifully at home every evening.</i></p>
<h3>L'inversione con l'ausiliare</h3>
<p>Per formare la domanda l'<b>ausiliare</b> va prima del soggetto. Se il verbo non ha un ausiliare (present e past simple) si usa <b>do / does / did</b>.</p>
<div class="tw"><table class="t"><tr><th>(Wh-word)</th><th>Ausiliare</th><th>Soggetto</th><th>Verbo</th><th>Resto</th></tr>
<tr><td></td><td>Is</td><td>Anna</td><td>—</td><td>at home?</td></tr>
<tr><td></td><td>Can</td><td>she</td><td>drive?</td><td></td></tr>
<tr><td>Where</td><td>does</td><td>Tom</td><td>work?</td><td></td></tr>
<tr><td>What</td><td>did</td><td>you</td><td>buy</td><td>yesterday?</td></tr>
<tr><td>How long</td><td>have</td><td>you</td><td>lived</td><td>here?</td></tr></table></div>
<p>Parole interrogative: <i>what, who, where, when, why, how, which, whose, how much / many, how long, how often</i>.</p>
<h3>Domande sul soggetto</h3>
<p>Quando <i>who</i> o <i>what</i> sono il <b>soggetto</b>, niente <i>do</i>: <i>Who <b>broke</b> the window?</i> (non <s>Who did break</s>). Confronta: <i>Who <b>did</b> you see?</i> (qui <i>who</i> è oggetto).</p>
<p class="nb">La preposizione resta alla fine: <i>Who are you talking <b>to</b>? Where are you <b>from</b>?</i></p>`,

<h3>Il problema</h3>
<p>Quando un verbo regge un altro verbo, l'inglese sceglie fra <b>gerundio</b> (-ing) e <b>infinito con to</b>. La scelta dipende dal primo verbo e va memorizzata, come i verbi che reggono il genitivo o il dativo in latino.</p>
<div class="tw"><table class="t"><tr><th>+ -ing</th><th>+ to + base</th></tr>
<tr><td>enjoy, finish, avoid, mind, keep, give up, suggest, practise, miss, can't stand</td><td>want, decide, hope, plan, promise, agree, refuse, learn, need, manage, offer, would like</td></tr>
<tr><td><i>I enjoy <b>swimming</b>.</i></td><td><i>I want <b>to swim</b>.</i></td></tr></table></div>
<h3>Dopo una preposizione: sempre -ing</h3>
<p><i>I'm good at <b>cooking</b>. Thanks for <b>coming</b>.</i> Attenzione a <i>look forward <b>to</b></i>, dove <i>to</i> è preposizione: <i>I'm looking forward to <b>seeing</b> you</i>.</p>
<h3>Infinito senza to</h3>
<p>Dopo i modali e dopo <b>make</b> e <b>let</b> + oggetto: <i>My parents let me <b>go</b>. She made me <b>laugh</b>.</i></p>
<p class="nb">Alcuni verbi cambiano significato: <i>I stopped <b>smoking</b></i> (ho smesso di fumare) / <i>I stopped <b>to smoke</b></i> (mi sono fermato per fumare); <i>remember / forget + -ing</i> = ricordare un fatto passato, <i>+ to</i> = ricordarsi di fare.</p>`,

<h3>La concordanza dei tempi</h3>
<p>Quando il verbo introduttivo è al passato (<i>said, told, asked</i>), i tempi del discorso diretto <b>arretrano</b> di un grado, come nella <i>consecutio temporum</i>.</p>
<div class="tw"><table class="t"><tr><th>Discorso diretto</th><th>Discorso indiretto</th></tr>
<tr><td>present simple: <i>"I am tired."</i></td><td>past simple: <i>he said he <b>was</b> tired</i></td></tr>
<tr><td>present continuous: <i>"I'm working."</i></td><td>past continuous: <i>was working</i></td></tr>
<tr><td>past simple / present perfect</td><td>past perfect: <i>had seen, had lost</i></td></tr>
<tr><td>will / can / must</td><td>would / could / had to</td></tr>
<tr><td>am going to</td><td>was going to</td></tr></table></div>
<h3>Pronomi e avverbi</h3>
<p>Cambiano anche pronomi e indicatori di tempo e luogo: <i>I → he/she, my → his/her, now → then, here → there, this → that, today → that day, yesterday → the day before, tomorrow → the next day</i>.</p>
<h3><i>Say</i> e <i>tell</i>; le domande</h3>
<p><i>Say</i> non vuole la persona (<i>he said that…</i>); <i>tell</i> sì (<i>he told <b>me</b> that…</i>). <i>That</i> si può omettere.</p>
<p>Nelle domande indirette l'ordine torna <b>affermativo</b> e sparisce <i>do</i>: <i>"Where do you live?" → She asked me where I <b>lived</b>.</i> Le domande sì/no prendono <b>if</b> o <b>whether</b>.</p>`,

function norm(s){

}

const FUNC=new Set('a an the do does did is are am was were be been being have has had will would shall should can could cannot may might must not no to of in on at for since by with from about into some any much many few little who whom which that whose where what when why how this these those i me my mine you your yours he him his she her hers it its we us our ours they them their theirs myself yourself himself herself itself ourselves yourselves themselves than as more most less least if whether there then here going yet already just ever never each other'.split(' '));
const FORM2BASE={};IRR.forEach(([b,p,pp])=>{FORM2BASE[b]=b;alt(p).forEach(x=>FORM2BASE[x]=b);alt(pp).forEach(x=>FORM2BASE[x]=b)});
const stem=w=>w.replace(/(ies|ied|ier|iest|ily)$/,'y').replace(/(ing|est|ed|er|es|ly|s|d)$/,'');
const infl=w=>/ing$/.test(w)?'ing':/ed$/.test(w)?'ed':/est$/.test(w)?'est':/er$/.test(w)?'er':/ly$/.test(w)?'ly':/s$/.test(w)?'s':'';
function osa(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}
  return d[a.length][b.length]}
// 'spell' = stessa parola scritta male; 'gram' = forma o parola sbagliata
function kindOf(u,c){
  if(FUNC.has(u)||(FUNC.has(c)&&u.length<3))return'gram';
  if(FORM2BASE[u]&&FORM2BASE[u]===FORM2BASE[c])return'gram';
  if(FORM2BASE[c]&&!FORM2BASE[u]&&stem(u)===FORM2BASE[c])return'gram';
  if(stem(u)===stem(c)&&stem(u).length>1&&infl(u)!==infl(c))return'gram';
  const d=osa(u,c),L=Math.max(u.length,c.length);
  return d<=(L>=5?2:1)&&d<L?'spell':'gram';
}
function align(U,C){
  const n=U.length,m=C.length,D=[...Array(n+1)].map(()=>Array(m+1).fill(0)),S={};
  const sub=(i,j)=>{const k=i+','+j;if(!(k in S))S[k]=U[i]===C[j]?0:kindOf(U[i],C[j])==='spell'?0.6:1.2;return S[k]};
  for(let i=0;i<=n;i++)D[i][0]=i;for(let j=0;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j-1]+sub(i-1,j-1),D[i-1][j]+1,D[i][j-1]+1);
  const ops=[];let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+sub(i-1,j-1)){ops.unshift({op:U[i-1]===C[j-1]?'eq':'sub',u:i-1,c:j-1});i--;j--}
    else if(i>0&&D[i][j]===D[i-1][j]+1){ops.unshift({op:'del',u:i-1});i--}
    else{ops.unshift({op:'ins',u:i,c:j-1});j--}
  }
  return{cost:D[n][m],ops};
}
function analyze(user,accepted){
  const NOAPO=/^(do|does|did|is|are|was|were|have|has|had|could|would|should|must|need|ca|wo)nt([.,!?;:]*)$/i;
  const raw=user.trim().split(/\s+/).filter(Boolean).map(r=>{const m=r.match(NOAPO);const fixed=m?r.replace(/nt([.,!?;:]*)$/i,"n't$1"):r;return{raw:r,apo:m?fixed.replace(/[.,!?;:]+$/,''):null,ex:norm(fixed).split(' ').filter(Boolean)}});
  const U=[];raw.forEach((r,ri)=>{r.first=U.length;r.ex.forEach(w=>U.push({w,ri,st:'ok'}))});
  let best=null;
  for(const a of accepted){const C=norm(a).split(' ').filter(Boolean);const r=align(U.map(x=>x.w),C);if(!best||r.cost<best.cost)best={...r,C,a}}
  const missing=[];
  for(const o of best.ops){
    if(o.op==='sub'){U[o.u].st=kindOf(U[o.u].w,best.C[o.c]);U[o.u].fix=best.C[o.c]}
    else if(o.op==='del')U[o.u].st='extra';
    else if(o.op==='ins')missing.push({at:o.u,w:best.C[o.c]});
  }
  // parola presente ma fuori posto: ordine delle parole
  U.forEach(t=>{if(t.st!=='extra')return;const k=missing.findIndex(m=>m.w===t.w);if(k>=0){t.st='order';missing.splice(k,1)}});
  const rank={ok:0,spell:1,order:2,gram:3,extra:3};
  raw.forEach((r,ri)=>{const ts=U.filter(t=>t.ri===ri);r.st=ts.reduce((s,t)=>rank[t.st]>rank[s]?t.st:s,'ok');r.fix=ts.map(t=>t.fix||t.w).join(' ');if(r.apo&&r.st==='ok'){r.st='spell';r.fix=r.apo;r.ex=[r.apo]}});
  const worst=Math.max(0,...raw.map(r=>rank[r.st]),missing.length?3:0);
  return{raw,missing,best:best.a,level:worst===1?'spell':'gram'};
}
function charMark(word,fix){
  const a=word.toLowerCase(),b=fix.toLowerCase(),L=[...Array(a.length+1)].map(()=>Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  // sequenza: lettere giuste, lettere sbagliate (evidenziate), ‸ dove manca una lettera
  const seq=[];let i=0,j=0;
  const push=(t,s)=>{const l=seq[seq.length-1];if(l&&l.t===t&&t!=='ins')l.s+=s;else if(!(l&&l.t==='ins'&&t==='ins'))seq.push({t,s})};
  while(i<a.length||j<b.length){
    if(i<a.length&&j<b.length&&a[i]===b[j]){push('ok',word[i]);i++;j++}
    else if(i<a.length&&(j>=b.length||L[i+1][j]>=L[i][j+1])){push('bad',word[i]);i++}
    else{push('ins','‸');j++}
  }
  return seq.map(x=>x.t==='ok'?x.s:el('mark',{title:x.t==='ins'?'manca una lettera':'lettera sbagliata o fuori posto'},x.s));
}
function renderDiff(an){
  const box=el('span',{class:'diff'});const add=x=>{if(box.childNodes.length)box.append(' ');box.append(x)};
  const miss=at=>an.missing.filter(m=>m.at===at).forEach(m=>add(el('span',{class:'tk mi',title:'parola mancante'},'+ '+m.w)));
  an.raw.forEach(r=>{
    miss(r.first);
    const m=r.raw.match(/^(.*?)([.,!?;:]*)$/),word=m[1],punct=m[2];
    if(r.st==='ok')add(el('span',{class:'tk ok'},r.raw));
    else if(r.st==='spell')add(el('span',{class:'tk sp',title:'ortografia'},...(r.ex.length===1?charMark(word,r.fix):[el('mark',{},word)]),punct,el('span',{class:'fix'},'→ '+r.fix)));
    else if(r.st==='order')add(el('span',{class:'tk or',title:'parola fuori posto'},'↔ '+r.raw));

    else add(el('span',{class:'tk gr',title:'forma sbagliata'},el('s',{},word),punct,el('span',{class:'fix'},'→ '+r.fix)));
  });

}
const LEGEND=[['var(--ok)','corretto'],['var(--warn-mark)','ortografia (lettere evidenziate)'],['var(--order)','parola fuori posto'],['var(--bad)','forma sbagliata, parola mancante o di troppo']];

function check(){

      const res=fields.map(f=>{const v=f.inp.value;if(matches(v,f.acc))return{lvl:'ok'};if(!v.trim())return{lvl:'gram',empty:true,acc:f.acc};const an=analyze(v,f.acc);return{lvl:an.level,an,acc:f.acc}});

      res.forEach((r,j)=>{if(r.lvl==='ok')return;const line=el('div',{class:'dl'});
        if(res.length>1)line.append(el('span',{class:'lab'},`${j+1}° spazio: `));

        line.append(el('span',{class:'lab'},' soluzione: '),el('span',{class:'ans'},r.an?r.an.best:r.acc[0]));fb.append(line)});
    }

  const p=prog[cur.id]||{best:0,n:0};p.best=Math.max(p.best,pct);p.last=pct;p.n++;prog[cur.id]=p;saveProg();renderToc();
}

    if(!r||typeof r.reply!=='string')throw{code:'invalid_json'};
    const last=conv.msgs[conv.msgs.length-1];
    if(text&&last&&last.role==='user'){last.corr=(Array.isArray(r.corrections)?r.corrections:[]).filter(c=>c&&c.wrong&&c.right).map(c=>({type:TYPECL[c.type]?c.type:'grammar',wrong:String(c.wrong),right:String(c.right),why:String(c.why||''),lesson:Number(c.lesson)||null}));last.better=String(r.better||'')}
    conv.msgs.push({role:'assistant',text:r.reply});
    if(conv.voice)speak(r.reply);
  }catch(e){
    convErr(e);
  }
  convBusy=false;saveConv();renderChat();
}
function convErr(e){
  const msg={not_granted:'Claude non è stato autorizzato per questa pagina.',sampling_disabled:'Claude non è disponibile per questo account.',rate_limited:'Troppe richieste ravvicinate: riprova fra qualche minuto.',invalid_json:'La risposta non era nel formato atteso: riprova.',session_expired:'Sessione scaduta: accedi di nuovo a claude.ai.'}[e&&e.code]||'Claude non ha risposto: riprova fra poco.';
  const n=$('#convNote');if(n)n.textContent=msg;
}
async function convBilancio(){
  if(convBusy||!sampleFn)return;
  const mine=conv.msgs.filter(m=>m.role==='user');if(!mine.length)return;
  convBusy=true;renderChat();
  const data=mine.map(m=>`- "${m.text}"`+(m.corr&&m.corr.length?` (errori: ${m.corr.map(c=>`${c.wrong} → ${c.right}`).join('; ')})`:'')).join('\n');
  const prompt=`Sei un insegnante di inglese. Ecco le frasi scritte da un adulto italiano (livello ${conv.level}) durante una conversazione, con gli errori già segnalati:
${data}

Scrivi un bilancio in italiano, sobrio e concreto. Indica le lezioni del corso da ripassare scegliendo da questo elenco: ${L.map(l=>l.n+' '+l.title).join('; ')}.
Rispondi SOLO con JSON: {"giudizio":"2-3 frasi","puntiForti":["..."],"daRipassare":[{"problema":"...","lezione":11}],"parole":[{"en":"...","it":"..."}]}
In "parole" metti fino a 6 parole o espressioni utili emerse o mancate nella conversazione.`;
  try{convReport=await sampleFn.json(prompt,{cache:false});}catch(e){convErr(e)}
  convBusy=false;renderChat();
  const r=$('#convReport');if(r)r.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderConv(){
  const pg=$('#page');pg.innerHTML='';
  pg.append(el('p',{class:'eyebrow'},'Esercizio orale e scritto'),el('h1',{},'Conversazione'),
    el('p',{class:'lede'},'Claude risponde in inglese e, sotto ogni tua battuta, segnala gli errori con i colori della correzione e il paragrafo da ripassare.'));
  if(!sampleFn){pg.append(el('p',{class:'empty'},'La conversazione usa Claude: funziona aprendo questa pagina su claude.ai con il tuo account. Se l’hai appena aperta, attendi qualche secondo.'));return}
  const set=el('div',{class:'conv-set'});
  const sc=el('div',{class:'chips'});SCEN.forEach(s=>sc.append(el('button',{type:'button',class:'chip'+(conv.scen===s.k?' sel':''),onclick:()=>{if(conv.scen===s.k)return;conv.scen=s.k;conv.msgs=[];convReport=null;saveConv();renderConv()}},s.t)));
  const lv=el('div',{class:'chips'});LEVELS.forEach(l=>lv.append(el('button',{type:'button',class:'chip'+(conv.level===l?' sel':''),onclick:()=>{conv.level=l;saveConv();renderConv()}},l)));
  set.append(el('div',{},el('div',{class:'lab'},'Situazione'),sc,el('p',{class:'scen-d'},(SCEN.find(s=>s.k===conv.scen)||SCEN[0]).d)),el('div',{},el('div',{class:'lab'},'Livello'),lv));
  const vb=el('input',{type:'checkbox',id:'voiceChk'});vb.checked=!!conv.voice;vb.addEventListener('change',()=>{conv.voice=vb.checked;saveConv()});
  const tools=el('div',{class:'conv-tools'},
    el('button',{class:'btn',onclick:()=>{conv.msgs=[];convReport=null;saveConv();renderChat();convSend('')}},'Nuova conversazione'),
    el('button',{class:'btn',id:'btnBil',onclick:convBilancio},'Bilancio'));
  if('speechSynthesis' in window)tools.append(el('label',{for:'voiceChk'},vb,'Leggi ad alta voce le risposte'));
  set.append(tools);
  pg.append(set,el('div',{class:'chat',id:'chat'}),el('p',{class:'hint',id:'convNote'}),el('div',{id:'convReportBox'}));
  const ta=el('textarea',{id:'convIn',rows:'1',placeholder:'Write in English…','aria-label':'La tua risposta in inglese',autocapitalize:'sentences'});
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px'});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
  const submit=()=>{const t=ta.value.trim();if(!t||convBusy)return;ta.value='';ta.style.height='auto';convSend(t)};
  pg.append(el('div',{class:'composer'},ta,el('button',{class:'btn primary',id:'btnSend',onclick:submit},'Invia')),
    el('p',{class:'hint'},'Per parlare invece di scrivere, usa il microfono della tastiera del telefono. Invio manda il messaggio, Maiusc+Invio va a capo.'));
  renderChat();
  if(!conv.msgs.length)convSend('');
}
function renderChat(){
  const ch=$('#chat');if(!ch)return;ch.innerHTML='';
  conv.msgs.forEach(m=>{
    if(m.role==='assistant'){ch.append(el('div',{class:'msg ai'},m.text,el('button',{class:'say',type:'button',onclick:()=>speak(m.text)},'Ascolta')));return}
    ch.append(el('div',{class:'msg me'},m.text));
    if(!m.corr)return;
    const box=el('div',{class:'corr'});
    if(!m.corr.length)box.append(el('span',{class:'ok'},m.better?'Corretto.':'Corretto, nessun errore.'));
    m.corr.forEach(c=>{const line=el('div',{},el('span',{class:'tk '+TYPECL[c.type],title:TYPELAB[c.type]},el('s',{},c.wrong)),' → ',el('b',{},c.right),c.why?el('span',{class:'lab'},' · '+c.why):'');
      const ls=c.lesson&&L[c.lesson-1];if(ls)line.append(el('a',{href:'#'+ls.id,onclick:e=>{e.preventDefault();open(ls.id)}},`§ ${ls.n}`));box.append(line)});
    if(m.better)box.append(el('div',{class:'better'},'Più naturale: ',el('i',{},m.better)));
    ch.append(box);
  });
  if(convBusy)ch.append(el('div',{class:'typing'},el('span',{class:'busy'}),'Claude sta scrivendo…'));
  const b1=$('#btnSend'),b2=$('#btnBil');if(b1)b1.disabled=convBusy;if(b2)b2.disabled=convBusy||!conv.msgs.some(m=>m.role==='user');
  if(conv.msgs.some(m=>m.corr&&m.corr.length)&&!$('#convLegend'))ch.after(el('div',{class:'legend',id:'convLegend'},...[['var(--bad)','grammatica'],['var(--warn-mark)','ortografia'],['var(--accent)','lessico'],['var(--order)','ordine delle parole']].map(([c,t])=>el('span',{},el('i',{style:`background:${c}`}),t))));
  const rb=$('#convReportBox');if(rb){rb.innerHTML='';if(convReport)rb.append(renderReport(convReport))}
  if(convBusy||conv.msgs.length)ch.lastChild?.scrollIntoView?.({block:'nearest'});
}
function renderReport(r){
  const box=el('section',{class:'report',id:'convReport'},el('h3',{},'Bilancio della conversazione'),el('p',{},String(r.giudizio||'')));
  if(Array.isArray(r.puntiForti)&&r.puntiForti.length)box.append(el('h4',{},'Punti forti'),el('ul',{},...r.puntiForti.map(x=>el('li',{},String(x)))));
  if(Array.isArray(r.daRipassare)&&r.daRipassare.length)box.append(el('h4',{},'Da ripassare'),el('ul',{},...r.daRipassare.map(x=>{const ls=L[(Number(x.lezione)||0)-1];return el('li',{},String(x.problema||''),ls?el('a',{href:'#'+ls.id,onclick:e=>{e.preventDefault();open(ls.id)}},` § ${ls.n} ${ls.title}`):'')})));
  if(Array.isArray(r.parole)&&r.parole.length)box.append(el('h4',{},'Parole ed espressioni'),el('ul',{},...r.parole.map(x=>el('li',{},el('i',{},String(x.en||'')),' — ',String(x.it||'')))));
  return box;
}
